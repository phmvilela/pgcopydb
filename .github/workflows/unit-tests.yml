name: Unit tests

# The fast, DB-free unit suite (pytest). `addopts` in pyproject.toml deselects
# the `integration` marker, so nothing here touches a real database or cluster --
# the live/k8s checks live in integration-tests.yml (manual only).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit test suite
        run: python -m pytest
