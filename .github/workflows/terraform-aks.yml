name: "Terraform: AKS cluster (validate)"

# Lint/validate the AKS cluster module (terraform/aks) that runs the deploy/k8s
# sharded pgcopydb migration.
#
#   validate : fmt -check + init -backend=false + validate. Runs on PRs that
#              touch terraform/aks/**, and on manual dispatch. No Azure needed,
#              so it works on forks and before any credentials exist.
#
# WHY NO plan/apply JOB
# ---------------------------------------------------------------------------
# `terraform apply` of this module provisions an entire cluster AND the IAM role
# assignments around it, so the executing identity needs broad rights --
# Contributor to CRUD every resource PLUS User Access Administrator to create the
# role assignments (Microsoft.Authorization/roleAssignments/write), i.e.
# effectively Owner at subscription scope. The federated CI identity is
# deliberately narrow (ACR Contributor + AKS Cluster User, for build.yml)
# and must stay that way, so provisioning is NOT run from CI.
#
# Instead, apply is a deliberate human action from Azure Cloud Shell (or local),
# run as a user who already holds Owner:
#
#     git clone https://github.com/berenguel/pgcyan.git && cd pgcyan/terraform
#     ./bootstrap-backend.sh                                   # one-time: state storage
#     cd aks && terraform init -backend-config=backend.hcl && terraform apply
#
# then set the GitHub repo secrets/vars from its outputs (terraform/aks/README.md
# step 6 + build.yml's header) so the image build/publish workflow and
# integration-tests.yml can run. See terraform/aks/README.md for the full runbook.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "terraform/aks/**"
      - ".github/workflows/terraform-aks.yml"

permissions:
  contents: read

jobs:
  validate:
    name: fmt + validate (no Azure)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/aks
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      # -backend=false: validate the config without touching remote state, so no
      # Azure credentials or backend.hcl are needed here.
      - name: terraform init (no backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate
