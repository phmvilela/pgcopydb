name: Integration tests

# Manual, cluster-backed integration tests -- issue #50. Runs on the AKS cluster
# against a real source database, so it is `workflow_dispatch` only and never on
# push/PR. It picks the image up by the COMMIT SHORT SHA (built + pushed by
# build.yml for the same commit) and fills the `image: "${PGCYAN_IMAGE}"`
# placeholder in the deploy/k8s manifests via `envsubst` before `kubectl apply`.
# `envsubst '${PGCYAN_IMAGE}'` substitutes ONLY that variable, leaving the
# manifests' runtime `$(SNAPSHOT_ID)` / `${RESTORE_JOBS}` refs intact.
#
# Three jobs. `planner` is independent; `pre-data` runs AFTER `snapshot-holder`
# (needs:) -- both use the singleton holder Deployment + pgcyan-snapshot
# ConfigMap, so they must never run at the same time.
#   planner         : phase -2 collector Job -> phase -1 planner Job, with a
#                     barrier between them; uploads plan.json + logs. Moves NO
#                     data.
#   snapshot-holder : applies the phase-1 holder Deployment, waits for it to
#                     establish (publication + slot + consistent snapshot), asserts
#                     the /work outputs, then tears it down GRACEFULLY and checks
#                     the clean-shutdown log line. Moves NO data.
#   pre-data        : (needs snapshot-holder) stands up the phase-1 holder, then
#                     runs the phase-0 pre-data Job (`restore-predata`, issue #24)
#                     against a REAL TARGET pinned to the holder's snapshot.
#                     Asserts target-pg-schema-log.json reports success and that
#                     the target ends up with tables but NO secondary indexes /
#                     FKs / triggers. Transfers SCHEMA only, no table data.
#
# TODO (as phases 2/3/4 are wired up): fold them in here too. The phase-2 data
# shards (#25) are best driven by the in-cluster orchestrator, which is being
# built in #70 (fold the holder into a StatefulSet orchestrator) -- the phase-2
# integration job lands there, running the real DAG end-to-end, rather than
# re-implementing per-phase kubectl glue here.
#
# ---------------------------------------------------------------------------
# PREREQUISITES (all one-time, see issue #50):
#   * terraform/aks applied (cluster + ACR + workload identities).
#   * build.yml has published pgcyan:<short-sha> for the commit being tested.
#   * The snapshot holder needs no PVC (--dir is a node-local emptyDir; the
#     snapshot id goes to the pgcyan-snapshot ConfigMap). The data shards need a
#     dynamic RWO managed-disk StorageClass (managed-csi on AKS) -- issue #58.
#   * The SOURCE server allows logical replication (wal_level=logical) and the
#     login role can CREATE PUBLICATION FOR ALL TABLES + a replication slot.
#   * GitHub config:
#       secrets:  AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID
#                 PG_SOURCE_USER / PG_SOURCE_PASSWORD
#                 PG_TARGET_USER / PG_TARGET_PASSWORD   (pre-data job only)
#       variables: AKS_RESOURCE_GROUP / AKS_CLUSTER_NAME
#                  PG_SOURCE_HOST / PG_SOURCE_PORT / PG_SOURCE_DATABASE
#                  PG_TARGET_HOST / PG_TARGET_PORT / PG_TARGET_DATABASE  (pre-data job)
#                  ACR_NAME (optional; defaults to pgcyanacr)
#     (Credentials are secrets; non-sensitive host/port/db are plain variables.)
#   * The pre-data job needs a REAL TARGET Postgres it can write schema to, with
#     the target roles pre-created (so `--no-owner` applies -- issue #24) and the
#     login role allowed to CREATE tables/sequences. It also stands up the phase-1
#     holder, so all the snapshot-holder prerequisites apply to it too.
#
# SECRETS POLICY: source-DB credentials live ONLY as GitHub secrets and are
# materialized into an in-cluster Secret at apply time -- no vault, nothing in
# git. (Azure Key Vault + CSI is a later hardening step.)
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:

permissions:
  id-token: write   # OIDC token for azure/login
  contents: read

env:
  NS: pgcyan-migration
  ACR_NAME: ${{ vars.ACR_NAME || 'pgcyanacr' }}

jobs:
  planner:
    name: Collect inputs, then plan (phase -2 -> -1)
    runs-on: ubuntu-latest
    # Fixed OIDC subject the federated credential trusts -- see build.yml.
    environment: azure
    env:
      AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
      AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Guard -- require Azure + AKS + source-DB config
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          PG_SOURCE_USER: ${{ secrets.PG_SOURCE_USER }}
          PG_SOURCE_PASSWORD: ${{ secrets.PG_SOURCE_PASSWORD }}
          PG_SOURCE_HOST: ${{ vars.PG_SOURCE_HOST }}
          PG_SOURCE_DATABASE: ${{ vars.PG_SOURCE_DATABASE }}
        run: |
          missing=()
          [ -z "${AZURE_CLIENT_ID}" ]     && missing+=("AZURE_CLIENT_ID secret")
          [ -z "${AKS_RESOURCE_GROUP}" ]  && missing+=("AKS_RESOURCE_GROUP variable")
          [ -z "${AKS_CLUSTER_NAME}" ]    && missing+=("AKS_CLUSTER_NAME variable")
          [ -z "${PG_SOURCE_USER}" ]      && missing+=("PG_SOURCE_USER secret")
          [ -z "${PG_SOURCE_PASSWORD}" ]  && missing+=("PG_SOURCE_PASSWORD secret")
          [ -z "${PG_SOURCE_HOST}" ]      && missing+=("PG_SOURCE_HOST variable")
          [ -z "${PG_SOURCE_DATABASE}" ]  && missing+=("PG_SOURCE_DATABASE variable")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::%s not set -- configure it before running (see workflow header).\n' "${missing[@]}"
            exit 1
          fi

      - name: Resolve the pgcyan image (commit short SHA)
        run: |
          echo "PGCYAN_IMAGE=${ACR_NAME}.azurecr.io/pgcyan:$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Azure login (OIDC, passwordless)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      # Idempotent. The planner-inputs/plan ConfigMaps are NOT applied here; the
      # two Jobs create them. The PVC (20) is not on the planner path.
      - name: Ensure namespace + RBAC
        run: |
          kubectl apply -f deploy/k8s/00-namespace.yaml
          kubectl apply -f deploy/k8s/01-rbac.yaml

      # Source-DB creds: GitHub secrets -> in-cluster Secret. Never in git.
      # Azure Postgres requires TLS, hence PGSSLMODE=require.
      - name: Create/refresh source-DB Secret
        env:
          PG_SOURCE_HOST: ${{ vars.PG_SOURCE_HOST }}
          PG_SOURCE_PORT: ${{ vars.PG_SOURCE_PORT }}
          PG_SOURCE_USER: ${{ secrets.PG_SOURCE_USER }}
          PG_SOURCE_PASSWORD: ${{ secrets.PG_SOURCE_PASSWORD }}
          PG_SOURCE_DATABASE: ${{ vars.PG_SOURCE_DATABASE }}
        run: |
          kubectl create secret generic pgcyan-source-pg -n "$NS" \
            --from-literal=PG_SOURCE_HOST="$PG_SOURCE_HOST" \
            --from-literal=PG_SOURCE_PORT="${PG_SOURCE_PORT:-5432}" \
            --from-literal=PG_SOURCE_USER="$PG_SOURCE_USER" \
            --from-literal=PG_SOURCE_PASSWORD="$PG_SOURCE_PASSWORD" \
            --from-literal=PG_SOURCE_DATABASE="$PG_SOURCE_DATABASE" \
            --from-literal=PGSSLMODE=require \
            --dry-run=client -o yaml | kubectl apply -f -

      # Jobs are immutable -- drop any leftovers from a prior run so re-applies
      # don't fail with "field is immutable".
      - name: Clear any prior Jobs
        run: |
          kubectl delete job pgcyan-collect-inputs pgcyan-planner \
            -n "$NS" --ignore-not-found --wait=true

      # A Job-completion barrier that respects backoffLimit: waits for the
      # terminal Complete OR Failed *condition*, not the transient .status.failed
      # counter (which ticks up on each retry before the final give-up).
      - name: Phase -2 -- collect inputs (barrier)
        run: |
          set -euo pipefail
          wait_job() {
            local job="$1" timeout="${2:-900}" elapsed=0 done_s fail_s
            echo "waiting for job/$job (timeout ${timeout}s) ..."
            while true; do
              done_s=$(kubectl get job "$job" -n "$NS" -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null || true)
              fail_s=$(kubectl get job "$job" -n "$NS" -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || true)
              [ "$done_s" = "True" ] && { echo "job/$job Complete"; return 0; }
              [ "$fail_s" = "True" ] && { echo "::error::job/$job Failed"; return 1; }
              [ "$elapsed" -ge "$timeout" ] && { echo "::error::job/$job timed out after ${timeout}s"; return 1; }
              sleep 10; elapsed=$((elapsed + 10))
            done
          }
          envsubst '${PGCYAN_IMAGE}' < deploy/k8s/25-job-collect-inputs.yaml | kubectl apply -f -
          wait_job pgcyan-collect-inputs 900

      # Applied only after the collector succeeds -- this is the DAG edge the
      # orchestrator would otherwise enforce. If the source has ANY large object,
      # the planner's LOB abort gate exits non-zero and this barrier fails with NO
      # plan written -- that is the correct, expected outcome, not a workflow bug.
      - name: Phase -1 -- plan (barrier)
        run: |
          set -euo pipefail
          wait_job() {
            local job="$1" timeout="${2:-900}" elapsed=0 done_s fail_s
            echo "waiting for job/$job (timeout ${timeout}s) ..."
            while true; do
              done_s=$(kubectl get job "$job" -n "$NS" -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null || true)
              fail_s=$(kubectl get job "$job" -n "$NS" -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || true)
              [ "$done_s" = "True" ] && { echo "job/$job Complete"; return 0; }
              [ "$fail_s" = "True" ] && { echo "::error::job/$job Failed (LOB abort gate is one legitimate cause)"; return 1; }
              [ "$elapsed" -ge "$timeout" ] && { echo "::error::job/$job timed out after ${timeout}s"; return 1; }
              sleep 10; elapsed=$((elapsed + 10))
            done
          }
          envsubst '${PGCYAN_IMAGE}' < deploy/k8s/30-job-planner.yaml | kubectl apply -f -
          wait_job pgcyan-planner 900

      # Always collect evidence -- especially on failure (LOB abort / DB error).
      - name: Gather plan + logs
        if: always()
        run: |
          mkdir -p planner-output
          kubectl logs -l pgcyan.dev/phase=collect-inputs -n "$NS" --tail=-1 \
            > planner-output/collect-inputs.log 2>&1 || true
          kubectl logs -l pgcyan.dev/phase=planner -n "$NS" --tail=-1 \
            > planner-output/planner.log 2>&1 || true
          kubectl get configmap pgcyan-plan -n "$NS" \
            -o go-template='{{range $k, $v := .data}}{{$k}}{{"\n"}}{{$v}}{{"\n"}}{{end}}' \
            > planner-output/pgcyan-plan.txt 2>/dev/null || echo "pgcyan-plan ConfigMap not present" > planner-output/pgcyan-plan.txt
          kubectl get configmap pgcyan-plan -n "$NS" \
            -o jsonpath='{.data.plan\.json}' > planner-output/plan.json 2>/dev/null || true
          echo "---- planner-output ----" && ls -la planner-output

      - name: Upload plan + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgcyan-plan-${{ github.run_id }}
          path: planner-output/*
          if-no-files-found: warn
          retention-days: 30

  snapshot-holder:
    name: Establish, verify, then gracefully tear down the snapshot holder (phase 1)
    runs-on: ubuntu-latest
    environment: azure
    env:
      DEPLOY: pgcyan-snapshot-holder
      AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
      AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Guard -- require Azure + AKS + source-DB config
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          PG_SOURCE_USER: ${{ secrets.PG_SOURCE_USER }}
          PG_SOURCE_PASSWORD: ${{ secrets.PG_SOURCE_PASSWORD }}
          PG_SOURCE_HOST: ${{ vars.PG_SOURCE_HOST }}
          PG_SOURCE_DATABASE: ${{ vars.PG_SOURCE_DATABASE }}
        run: |
          missing=()
          [ -z "${AZURE_CLIENT_ID}" ]     && missing+=("AZURE_CLIENT_ID secret")
          [ -z "${AKS_RESOURCE_GROUP}" ]  && missing+=("AKS_RESOURCE_GROUP variable")
          [ -z "${AKS_CLUSTER_NAME}" ]    && missing+=("AKS_CLUSTER_NAME variable")
          [ -z "${PG_SOURCE_USER}" ]      && missing+=("PG_SOURCE_USER secret")
          [ -z "${PG_SOURCE_PASSWORD}" ]  && missing+=("PG_SOURCE_PASSWORD secret")
          [ -z "${PG_SOURCE_HOST}" ]      && missing+=("PG_SOURCE_HOST variable")
          [ -z "${PG_SOURCE_DATABASE}" ]  && missing+=("PG_SOURCE_DATABASE variable")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::%s not set -- configure it before running (see workflow header).\n' "${missing[@]}"
            exit 1
          fi

      - name: Resolve the pgcyan image (commit short SHA)
        run: |
          echo "PGCYAN_IMAGE=${ACR_NAME}.azurecr.io/pgcyan:$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Azure login (OIDC, passwordless)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      # The holder needs no PVC now (--dir is a node-local emptyDir; the snapshot
      # id goes to the pgcyan-snapshot ConfigMap -- issue #58). 01-rbac.yaml
      # defines the pgcyan-orchestrator SA it runs as (configmaps create/patch),
      # required for the publish step.
      - name: Ensure namespace + RBAC
        run: |
          kubectl apply -f deploy/k8s/00-namespace.yaml
          kubectl apply -f deploy/k8s/01-rbac.yaml

      # The holder reads pgcopydb's native PGCOPYDB_SOURCE_PGURI from the
      # `pgcyan-db-uris` Secret. Build it from the same PG_SOURCE_* GitHub
      # secrets/variables; never in git. Azure Postgres requires TLS ->
      # sslmode=require. (A target URI is not needed for phase 1 -- the holder
      # only touches the source -- but the key is set empty so the Secret shape
      # matches 10-secrets.example.yaml.)
      - name: Create/refresh source-DB Secret (PGCOPYDB_SOURCE_PGURI)
        env:
          PG_SOURCE_HOST: ${{ vars.PG_SOURCE_HOST }}
          PG_SOURCE_PORT: ${{ vars.PG_SOURCE_PORT }}
          PG_SOURCE_USER: ${{ secrets.PG_SOURCE_USER }}
          PG_SOURCE_PASSWORD: ${{ secrets.PG_SOURCE_PASSWORD }}
          PG_SOURCE_DATABASE: ${{ vars.PG_SOURCE_DATABASE }}
        run: |
          port="${PG_SOURCE_PORT:-5432}"
          # URL-encode the user/password so special characters survive the URI.
          enc() { python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$1"; }
          u="$(enc "$PG_SOURCE_USER")"; p="$(enc "$PG_SOURCE_PASSWORD")"
          uri="postgres://${u}:${p}@${PG_SOURCE_HOST}:${port}/${PG_SOURCE_DATABASE}?sslmode=require"
          kubectl create secret generic pgcyan-db-uris -n "$NS" \
            --from-literal=PGCOPYDB_SOURCE_PGURI="$uri" \
            --from-literal=PGCOPYDB_TARGET_PGURI="" \
            --dry-run=client -o yaml | kubectl apply -f -

      # Start clean so a leftover holder from a prior run can't mask a fresh
      # snapshot, and drop any stale pgcyan-snapshot ConfigMap so a prior run's
      # id cannot linger.
      - name: Clear any prior holder
        run: |
          envsubst '${PGCYAN_IMAGE}' < deploy/k8s/50-deployment-snapshot-holder.yaml \
            | kubectl delete -f - -n "$NS" --ignore-not-found --wait=true
          kubectl delete configmap/pgcyan-snapshot -n "$NS" --ignore-not-found

      - name: Apply the snapshot holder
        run: envsubst '${PGCYAN_IMAGE}' < deploy/k8s/50-deployment-snapshot-holder.yaml | kubectl apply -f -

      # The readiness probe passes only once source-pg-slot.json exists, so a
      # ready replica == publication + slot + consistent snapshot all established.
      - name: Wait for the holder to establish + become ready
        run: |
          set -euo pipefail
          echo "waiting for the holder pod to be Running ..."
          kubectl wait --for=condition=Ready pod \
            -l pgcyan.dev/phase=snapshot-holder -n "$NS" --timeout=300s
          echo "waiting for the Deployment to report an available replica ..."
          kubectl rollout status deploy/"$DEPLOY" -n "$NS" --timeout=300s

      # Acceptance: the outputs exist in the pod's node-local scratch dir AND the
      # snapshot id was published to the pgcyan-snapshot ConfigMap for the shards.
      - name: Verify outputs + snapshot ConfigMap
        run: |
          set -euo pipefail
          pod="$(kubectl get pod -l pgcyan.dev/phase=snapshot-holder -n "$NS" \
                   -o jsonpath='{.items[0].metadata.name}')"
          echo "holder pod: $pod"
          echo "---- /pgcopydb ----"
          kubectl exec "$pod" -n "$NS" -- ls -la /pgcopydb
          for f in source-pg-slot.json source-pg-publication.json snapshot; do
            echo "asserting /pgcopydb/$f is present and non-empty ..."
            kubectl exec "$pod" -n "$NS" -- test -s "/pgcopydb/$f"
          done
          echo "---- source-pg-slot.json ----"
          kubectl exec "$pod" -n "$NS" -- cat /pgcopydb/source-pg-slot.json
          echo "---- pgcyan-snapshot ConfigMap ----"
          # The shards read this key via configMapKeyRef -- it must be non-empty
          # and match the exported snapshot id in the scratch dir.
          cm_id="$(kubectl get configmap pgcyan-snapshot -n "$NS" -o jsonpath='{.data.snapshot}')"
          file_id="$(kubectl exec "$pod" -n "$NS" -- cat /pgcopydb/snapshot | tr -d '[:space:]')"
          echo "ConfigMap snapshot=[$cm_id]  file snapshot=[$file_id]"
          [ -n "$cm_id" ] || { echo "::error::pgcyan-snapshot ConfigMap has no 'snapshot' key"; exit 1; }
          [ "$cm_id" = "$file_id" ] || { echo "::error::ConfigMap id does not match the exported snapshot id"; exit 1; }

      # Grab the outputs + logs BEFORE teardown, for the artifact.
      - name: Collect outputs + establish logs
        if: always()
        run: |
          mkdir -p snapshot-output
          pod="$(kubectl get pod -l pgcyan.dev/phase=snapshot-holder -n "$NS" \
                   -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
          if [ -n "${pod:-}" ]; then
            for f in source-pg-slot.json source-pg-publication.json snapshot; do
              kubectl exec "$pod" -n "$NS" -- cat "/pgcopydb/$f" \
                > "snapshot-output/$f" 2>/dev/null || true
            done
          fi
          kubectl get configmap pgcyan-snapshot -n "$NS" -o yaml \
            > snapshot-output/pgcyan-snapshot-configmap.yaml 2>/dev/null || true
          kubectl logs -l pgcyan.dev/phase=snapshot-holder -n "$NS" --tail=-1 \
            > snapshot-output/holder.log 2>&1 || true
          ls -la snapshot-output

      # Graceful teardown: deleting the Deployment SIGTERMs the pod; the wrapper
      # then SIGTERMs pgcopydb, which closes the replication connection cleanly
      # within terminationGracePeriodSeconds (60s). --cascade=foreground blocks
      # until the owned pod is actually gone, then wait explicitly as a
      # belt-and-braces guard (timeout > the 60s grace period).
      - name: Gracefully shut the holder down
        run: |
          set -euo pipefail
          kubectl delete deploy/"$DEPLOY" -n "$NS" \
            --cascade=foreground --wait=true --timeout=120s
          kubectl delete pdb/pgcyan-snapshot-holder -n "$NS" --ignore-not-found
          kubectl delete configmap/pgcyan-snapshot -n "$NS" --ignore-not-found
          echo "waiting for the holder pod to fully terminate ..."
          # --for=delete exits non-zero with "no matching resources" if the pod
          # is already gone -- that's the success case, so tolerate it and let
          # the assertion below be the real gate.
          kubectl wait --for=delete pod \
            -l pgcyan.dev/phase=snapshot-holder -n "$NS" --timeout=90s || true
          echo "verifying no pod remains ..."
          kubectl get pod -l pgcyan.dev/phase=snapshot-holder -n "$NS" 2>&1 | tee /tmp/pods.txt
          grep -q "No resources found" /tmp/pods.txt \
            || [ -z "$(kubectl get pod -l pgcyan.dev/phase=snapshot-holder -n "$NS" -o name)" ]

      # Confirm the shutdown was graceful (the wrapper logged the clean stop),
      # not a SIGKILL -- this is what proves the source connection was released.
      - name: Assert graceful shutdown in the logs
        run: |
          set -euo pipefail
          if grep -q "terminating the snapshot holder" snapshot-output/holder.log \
             || grep -q "source connection released" snapshot-output/holder.log; then
            echo "graceful shutdown confirmed"
          else
            echo "::warning::did not observe the graceful-shutdown log line (pod logs may have rotated on delete)"
          fi

      - name: Upload holder outputs + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgcyan-snapshot-holder-${{ github.run_id }}
          path: snapshot-output/*
          if-no-files-found: warn
          retention-days: 30

  pre-data:
    name: Transfer pre-data schema to the target, then verify (phase 0)
    runs-on: ubuntu-latest
    environment: azure
    # MUST run after snapshot-holder, never alongside it: both jobs stand up the
    # SINGLETON pgcyan-snapshot-holder Deployment and publish the SAME
    # pgcyan-snapshot ConfigMap in the SAME namespace. Run concurrently, the two
    # holders race and one job's ConfigMap write lands under the other's pod
    # (mismatched snapshot ids). Serializing them keeps each job's holder alone.
    needs: snapshot-holder
    env:
      DEPLOY: pgcyan-snapshot-holder
      AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
      AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Pre-data touches BOTH the source (schema dump, pinned to the holder's
      # snapshot) and a real TARGET (schema restore), so it needs both sets of
      # DB config plus the Azure/AKS config.
      - name: Guard -- require Azure + AKS + source + target DB config
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          PG_SOURCE_USER: ${{ secrets.PG_SOURCE_USER }}
          PG_SOURCE_PASSWORD: ${{ secrets.PG_SOURCE_PASSWORD }}
          PG_SOURCE_HOST: ${{ vars.PG_SOURCE_HOST }}
          PG_SOURCE_DATABASE: ${{ vars.PG_SOURCE_DATABASE }}
          PG_TARGET_USER: ${{ secrets.PG_TARGET_USER }}
          PG_TARGET_PASSWORD: ${{ secrets.PG_TARGET_PASSWORD }}
          PG_TARGET_HOST: ${{ vars.PG_TARGET_HOST }}
          PG_TARGET_DATABASE: ${{ vars.PG_TARGET_DATABASE }}
        run: |
          missing=()
          [ -z "${AZURE_CLIENT_ID}" ]     && missing+=("AZURE_CLIENT_ID secret")
          [ -z "${AKS_RESOURCE_GROUP}" ]  && missing+=("AKS_RESOURCE_GROUP variable")
          [ -z "${AKS_CLUSTER_NAME}" ]    && missing+=("AKS_CLUSTER_NAME variable")
          [ -z "${PG_SOURCE_USER}" ]      && missing+=("PG_SOURCE_USER secret")
          [ -z "${PG_SOURCE_PASSWORD}" ]  && missing+=("PG_SOURCE_PASSWORD secret")
          [ -z "${PG_SOURCE_HOST}" ]      && missing+=("PG_SOURCE_HOST variable")
          [ -z "${PG_SOURCE_DATABASE}" ]  && missing+=("PG_SOURCE_DATABASE variable")
          [ -z "${PG_TARGET_USER}" ]      && missing+=("PG_TARGET_USER secret")
          [ -z "${PG_TARGET_PASSWORD}" ]  && missing+=("PG_TARGET_PASSWORD secret")
          [ -z "${PG_TARGET_HOST}" ]      && missing+=("PG_TARGET_HOST variable")
          [ -z "${PG_TARGET_DATABASE}" ]  && missing+=("PG_TARGET_DATABASE variable")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::%s not set -- configure it before running (see workflow header).\n' "${missing[@]}"
            exit 1
          fi

      - name: Resolve the pgcyan image (commit short SHA)
        run: |
          echo "PGCYAN_IMAGE=${ACR_NAME}.azurecr.io/pgcyan:$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Azure login (OIDC, passwordless)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      # 01-rbac.yaml defines both the pgcyan-orchestrator SA (holder) and the
      # pgcyan-worker SA (the pre-data Job). 20-pvc-workdir.yaml supplies the
      # pgcyan-workdir-predata RWO disk the pre-data Job mounts as --dir.
      - name: Ensure namespace + RBAC + work-dir PVC
        run: |
          kubectl apply -f deploy/k8s/00-namespace.yaml
          kubectl apply -f deploy/k8s/01-rbac.yaml
          kubectl apply -f deploy/k8s/20-pvc-workdir.yaml

      # Build the pgcyan-db-uris Secret with BOTH source (for the holder + the
      # schema dump) and target (for the schema restore) URIs. Azure Postgres
      # requires TLS -> sslmode=require. Never in git.
      - name: Create/refresh DB Secret (SOURCE + TARGET PGURIs)
        env:
          PG_SOURCE_HOST: ${{ vars.PG_SOURCE_HOST }}
          PG_SOURCE_PORT: ${{ vars.PG_SOURCE_PORT }}
          PG_SOURCE_USER: ${{ secrets.PG_SOURCE_USER }}
          PG_SOURCE_PASSWORD: ${{ secrets.PG_SOURCE_PASSWORD }}
          PG_SOURCE_DATABASE: ${{ vars.PG_SOURCE_DATABASE }}
          PG_TARGET_HOST: ${{ vars.PG_TARGET_HOST }}
          PG_TARGET_PORT: ${{ vars.PG_TARGET_PORT }}
          PG_TARGET_USER: ${{ secrets.PG_TARGET_USER }}
          PG_TARGET_PASSWORD: ${{ secrets.PG_TARGET_PASSWORD }}
          PG_TARGET_DATABASE: ${{ vars.PG_TARGET_DATABASE }}
        run: |
          enc() { python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$1"; }
          sport="${PG_SOURCE_PORT:-5432}"; tport="${PG_TARGET_PORT:-5432}"
          su="$(enc "$PG_SOURCE_USER")"; sp="$(enc "$PG_SOURCE_PASSWORD")"
          tu="$(enc "$PG_TARGET_USER")"; tp="$(enc "$PG_TARGET_PASSWORD")"
          source_uri="postgres://${su}:${sp}@${PG_SOURCE_HOST}:${sport}/${PG_SOURCE_DATABASE}?sslmode=require"
          target_uri="postgres://${tu}:${tp}@${PG_TARGET_HOST}:${tport}/${PG_TARGET_DATABASE}?sslmode=require"
          kubectl create secret generic pgcyan-db-uris -n "$NS" \
            --from-literal=PGCOPYDB_SOURCE_PGURI="$source_uri" \
            --from-literal=PGCOPYDB_TARGET_PGURI="$target_uri" \
            --dry-run=client -o yaml | kubectl apply -f -

      # Start clean: drop any leftover holder, pre-data Job, snapshot ConfigMap
      # and check Job from a prior run.
      - name: Clear prior holder + pre-data Job
        run: |
          envsubst '${PGCYAN_IMAGE}' < deploy/k8s/50-deployment-snapshot-holder.yaml \
            | kubectl delete -f - -n "$NS" --ignore-not-found --wait=true
          kubectl delete job pgcyan-phase0-predata pgcyan-target-check \
            -n "$NS" --ignore-not-found --wait=true
          kubectl delete configmap/pgcyan-snapshot -n "$NS" --ignore-not-found

      # The pre-data schema dump pins to the holder's snapshot, so the holder
      # must be Ready (snapshot exported + published to the ConfigMap) first.
      - name: Apply the snapshot holder and wait until Ready
        run: |
          set -euo pipefail
          envsubst '${PGCYAN_IMAGE}' < deploy/k8s/50-deployment-snapshot-holder.yaml | kubectl apply -f -
          echo "waiting for the holder to establish + publish the snapshot ConfigMap ..."
          kubectl wait --for=condition=Ready pod \
            -l pgcyan.dev/phase=snapshot-holder -n "$NS" --timeout=300s
          kubectl rollout status deploy/"$DEPLOY" -n "$NS" --timeout=300s
          # The pre-data Job reads SNAPSHOT_ID via configMapKeyRef -- fail early
          # (with a clear message) if the holder did not publish it.
          test -n "$(kubectl get configmap pgcyan-snapshot -n "$NS" -o jsonpath='{.data.snapshot}')" \
            || { echo "::error::pgcyan-snapshot ConfigMap has no 'snapshot' key"; exit 1; }

      # Phase-0 barrier: apply the pre-data Job and wait for the terminal
      # Complete/Failed condition (respects backoffLimit, like the planner jobs).
      - name: Phase 0 -- pre-data (barrier)
        run: |
          set -euo pipefail
          wait_job() {
            local job="$1" timeout="${2:-900}" elapsed=0 done_s fail_s
            echo "waiting for job/$job (timeout ${timeout}s) ..."
            while true; do
              done_s=$(kubectl get job "$job" -n "$NS" -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null || true)
              fail_s=$(kubectl get job "$job" -n "$NS" -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || true)
              [ "$done_s" = "True" ] && { echo "job/$job Complete"; return 0; }
              [ "$fail_s" = "True" ] && { echo "::error::job/$job Failed"; return 1; }
              [ "$elapsed" -ge "$timeout" ] && { echo "::error::job/$job timed out after ${timeout}s"; return 1; }
              sleep 10; elapsed=$((elapsed + 10))
            done
          }
          envsubst '${PGCYAN_IMAGE}' < deploy/k8s/40-job-phase0-predata.yaml | kubectl apply -f -
          wait_job pgcyan-phase0-predata 900

      # Acceptance: the wrapper reported success (target-pg-schema-log.json), i.e.
      # the phase-0 pod's stdout carries the success summary.
      - name: Assert the pre-data wrapper reported success
        run: |
          set -euo pipefail
          kubectl logs -l pgcyan.dev/phase=pre-data -n "$NS" --tail=-1 | tee /tmp/predata.log
          # Match the wrapper's FINAL run event (emitted only on full success),
          # not a per-step success event that also fires on a failed overall run.
          grep -q 'Pre-data schema transfer complete' /tmp/predata.log \
            || { echo "::error::pre-data did not report overall success"; exit 1; }

      # Acceptance: the TARGET now has tables but NO secondary indexes, foreign
      # keys, or triggers (pre-data section only -- PK/unique + secondary indexes
      # + FKs are the post-data phase, #28). Run the check IN-CLUSTER (the target
      # is typically not reachable from the runner) via a throwaway Job on the
      # same image (psql ships in it) using the target URI from the Secret.
      - name: Verify target schema shape (tables, no indexes/FK/triggers)
        run: |
          set -euo pipefail
          kubectl delete job pgcyan-target-check -n "$NS" --ignore-not-found --wait=true
          cat <<'EOF' | envsubst '${PGCYAN_IMAGE}' | kubectl apply -n "$NS" -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: pgcyan-target-check
            labels: { pgcyan.dev/phase: "pre-data-check" }
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 3600
            template:
              metadata:
                labels: { pgcyan.dev/phase: "pre-data-check" }
              spec:
                serviceAccountName: pgcyan-worker
                restartPolicy: Never
                containers:
                  - name: check
                    image: "${PGCYAN_IMAGE}"
                    envFrom:
                      - secretRef: { name: pgcyan-db-uris }
                    command: ["sh", "-c"]
                    args:
                      - |
                        psql "$PGCOPYDB_TARGET_PGURI" -tA -v ON_ERROR_STOP=1 -c "SELECT 'RESULT'||' tables='||(SELECT count(*) FROM pg_tables WHERE schemaname NOT IN ('pg_catalog','information_schema'))||' indexes='||(SELECT count(*) FROM pg_indexes WHERE schemaname NOT IN ('pg_catalog','information_schema'))||' fks='||(SELECT count(*) FROM pg_constraint c JOIN pg_namespace n ON n.oid=c.connamespace WHERE c.contype='f' AND n.nspname NOT IN ('pg_catalog','information_schema'))||' triggers='||(SELECT count(*) FROM pg_trigger t JOIN pg_class cl ON cl.oid=t.tgrelid JOIN pg_namespace n ON n.oid=cl.relnamespace WHERE NOT t.tgisinternal AND n.nspname NOT IN ('pg_catalog','information_schema'))"
          EOF
          kubectl wait --for=condition=complete job/pgcyan-target-check -n "$NS" --timeout=120s \
            || { kubectl logs job/pgcyan-target-check -n "$NS" || true; echo "::error::target check Job did not complete"; exit 1; }
          line="$(kubectl logs job/pgcyan-target-check -n "$NS" --tail=-1 | grep -o 'RESULT tables=[0-9]* indexes=[0-9]* fks=[0-9]* triggers=[0-9]*' | tail -1)"
          echo "target schema counts: [$line]"
          [ -n "$line" ] || { echo "::error::could not read target schema counts"; exit 1; }
          tables=$(echo "$line" | sed -E 's/.*tables=([0-9]+).*/\1/')
          indexes=$(echo "$line" | sed -E 's/.*indexes=([0-9]+).*/\1/')
          fks=$(echo "$line" | sed -E 's/.*fks=([0-9]+).*/\1/')
          triggers=$(echo "$line" | sed -E 's/.*triggers=([0-9]+).*/\1/')
          fail=0
          [ "$tables" -gt 0 ]    || { echo "::error::expected tables > 0 on the target, got $tables"; fail=1; }
          [ "$indexes" -eq 0 ]   || { echo "::error::expected 0 secondary indexes/PK on the target, got $indexes"; fail=1; }
          [ "$fks" -eq 0 ]       || { echo "::error::expected 0 foreign keys on the target, got $fks"; fail=1; }
          [ "$triggers" -eq 0 ]  || { echo "::error::expected 0 triggers on the target, got $triggers"; fail=1; }
          [ "$fail" -eq 0 ] || exit 1
          echo "target schema shape OK: $tables tables, no secondary indexes / FKs / triggers"

      - name: Collect pre-data logs
        if: always()
        run: |
          mkdir -p predata-output
          kubectl logs -l pgcyan.dev/phase=pre-data -n "$NS" --tail=-1 \
            > predata-output/predata.log 2>&1 || true
          kubectl logs job/pgcyan-target-check -n "$NS" --tail=-1 \
            > predata-output/target-check.log 2>&1 || true
          kubectl logs -l pgcyan.dev/phase=snapshot-holder -n "$NS" --tail=-1 \
            > predata-output/holder.log 2>&1 || true
          ls -la predata-output

      # Tear everything down: the pre-data/check Jobs and the holder (gracefully,
      # so no stale source connection is left behind).
      - name: Teardown
        if: always()
        run: |
          kubectl delete job pgcyan-phase0-predata pgcyan-target-check \
            -n "$NS" --ignore-not-found --wait=false || true
          kubectl delete deploy/"$DEPLOY" -n "$NS" \
            --cascade=foreground --wait=true --timeout=120s || true
          kubectl delete pdb/pgcyan-snapshot-holder -n "$NS" --ignore-not-found || true
          kubectl delete configmap/pgcyan-snapshot -n "$NS" --ignore-not-found || true

      - name: Upload pre-data logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgcyan-pre-data-${{ github.run_id }}
          path: predata-output/*
          if-no-files-found: warn
          retention-days: 30
