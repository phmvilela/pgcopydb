name: Integration tests

# Manual, cluster-backed integration tests -- issue #50. Runs on the AKS cluster
# against a real source database, so it is `workflow_dispatch` only and never on
# push/PR. It picks the image up by the COMMIT SHORT SHA (built + pushed by
# build.yml for the same commit) and fills the `image: "${PGCYAN_IMAGE}"`
# placeholder in the deploy/k8s manifests via `envsubst` before `kubectl apply`.
# `envsubst '${PGCYAN_IMAGE}'` substitutes ONLY that variable, leaving the
# manifests' runtime `$(SNAPSHOT_ID)` / `${RESTORE_JOBS}` refs intact.
#
# Two jobs, each an independent integration test that moves NO data:
#   planner         : phase -2 collector Job -> phase -1 planner Job, with a
#                     barrier between them; uploads plan.json + logs.
#   snapshot-holder : applies the phase-1 holder Deployment, waits for it to
#                     establish (publication + slot + consistent snapshot), asserts
#                     the /work outputs, then tears it down GRACEFULLY and checks
#                     the clean-shutdown log line.
#
# TODO (as phases 0/2/3/4 are wired up): fold them in here too -- ideally by
# running the full `python -m pg_cyan.cli orchestrate` path end-to-end and
# asserting the DAG completes, replacing these piecemeal per-phase jobs.
#
# ---------------------------------------------------------------------------
# PREREQUISITES (all one-time, see issue #50):
#   * terraform/aks applied (cluster + ACR + workload identities).
#   * build.yml has published pgcyan:<short-sha> for the commit being tested.
#   * A dynamic RWX StorageClass for 20-pvc-workdir.yaml (azurefile-csi on AKS).
#   * The SOURCE server allows logical replication (wal_level=logical) and the
#     login role can CREATE PUBLICATION FOR ALL TABLES + a replication slot.
#   * GitHub config:
#       secrets:  AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID
#                 PG_SOURCE_USER / PG_SOURCE_PASSWORD
#       variables: AKS_RESOURCE_GROUP / AKS_CLUSTER_NAME
#                  PG_SOURCE_HOST / PG_SOURCE_PORT / PG_SOURCE_DATABASE
#                  ACR_NAME (optional; defaults to pgcyanacr)
#     (Credentials are secrets; non-sensitive host/port/db are plain variables.)
#
# SECRETS POLICY: source-DB credentials live ONLY as GitHub secrets and are
# materialized into an in-cluster Secret at apply time -- no vault, nothing in
# git. (Azure Key Vault + CSI is a later hardening step.)
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:

permissions:
  id-token: write   # OIDC token for azure/login
  contents: read

env:
  NS: pgcyan-migration
  ACR_NAME: ${{ vars.ACR_NAME || 'pgcyanacr' }}

jobs:
  planner:
    name: Collect inputs, then plan (phase -2 -> -1)
    runs-on: ubuntu-latest
    # Fixed OIDC subject the federated credential trusts -- see build.yml.
    environment: azure
    env:
      AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
      AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Guard -- require Azure + AKS + source-DB config
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          PG_SOURCE_USER: ${{ secrets.PG_SOURCE_USER }}
          PG_SOURCE_PASSWORD: ${{ secrets.PG_SOURCE_PASSWORD }}
          PG_SOURCE_HOST: ${{ vars.PG_SOURCE_HOST }}
          PG_SOURCE_DATABASE: ${{ vars.PG_SOURCE_DATABASE }}
        run: |
          missing=()
          [ -z "${AZURE_CLIENT_ID}" ]     && missing+=("AZURE_CLIENT_ID secret")
          [ -z "${AKS_RESOURCE_GROUP}" ]  && missing+=("AKS_RESOURCE_GROUP variable")
          [ -z "${AKS_CLUSTER_NAME}" ]    && missing+=("AKS_CLUSTER_NAME variable")
          [ -z "${PG_SOURCE_USER}" ]      && missing+=("PG_SOURCE_USER secret")
          [ -z "${PG_SOURCE_PASSWORD}" ]  && missing+=("PG_SOURCE_PASSWORD secret")
          [ -z "${PG_SOURCE_HOST}" ]      && missing+=("PG_SOURCE_HOST variable")
          [ -z "${PG_SOURCE_DATABASE}" ]  && missing+=("PG_SOURCE_DATABASE variable")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::%s not set -- configure it before running (see workflow header).\n' "${missing[@]}"
            exit 1
          fi

      - name: Resolve the pgcyan image (commit short SHA)
        run: |
          echo "PGCYAN_IMAGE=${ACR_NAME}.azurecr.io/pgcyan:$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Azure login (OIDC, passwordless)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      # Idempotent. The planner-inputs/plan ConfigMaps are NOT applied here; the
      # two Jobs create them. The PVC (20) is not on the planner path.
      - name: Ensure namespace + RBAC
        run: |
          kubectl apply -f deploy/k8s/00-namespace.yaml
          kubectl apply -f deploy/k8s/01-rbac.yaml

      # Source-DB creds: GitHub secrets -> in-cluster Secret. Never in git.
      # Azure Postgres requires TLS, hence PGSSLMODE=require.
      - name: Create/refresh source-DB Secret
        env:
          PG_SOURCE_HOST: ${{ vars.PG_SOURCE_HOST }}
          PG_SOURCE_PORT: ${{ vars.PG_SOURCE_PORT }}
          PG_SOURCE_USER: ${{ secrets.PG_SOURCE_USER }}
          PG_SOURCE_PASSWORD: ${{ secrets.PG_SOURCE_PASSWORD }}
          PG_SOURCE_DATABASE: ${{ vars.PG_SOURCE_DATABASE }}
        run: |
          kubectl create secret generic pgcyan-source-pg -n "$NS" \
            --from-literal=PG_SOURCE_HOST="$PG_SOURCE_HOST" \
            --from-literal=PG_SOURCE_PORT="${PG_SOURCE_PORT:-5432}" \
            --from-literal=PG_SOURCE_USER="$PG_SOURCE_USER" \
            --from-literal=PG_SOURCE_PASSWORD="$PG_SOURCE_PASSWORD" \
            --from-literal=PG_SOURCE_DATABASE="$PG_SOURCE_DATABASE" \
            --from-literal=PGSSLMODE=require \
            --dry-run=client -o yaml | kubectl apply -f -

      # Jobs are immutable -- drop any leftovers from a prior run so re-applies
      # don't fail with "field is immutable".
      - name: Clear any prior Jobs
        run: |
          kubectl delete job pgcyan-collect-inputs pgcyan-planner \
            -n "$NS" --ignore-not-found --wait=true

      # A Job-completion barrier that respects backoffLimit: waits for the
      # terminal Complete OR Failed *condition*, not the transient .status.failed
      # counter (which ticks up on each retry before the final give-up).
      - name: Phase -2 -- collect inputs (barrier)
        run: |
          set -euo pipefail
          wait_job() {
            local job="$1" timeout="${2:-900}" elapsed=0 done_s fail_s
            echo "waiting for job/$job (timeout ${timeout}s) ..."
            while true; do
              done_s=$(kubectl get job "$job" -n "$NS" -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null || true)
              fail_s=$(kubectl get job "$job" -n "$NS" -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || true)
              [ "$done_s" = "True" ] && { echo "job/$job Complete"; return 0; }
              [ "$fail_s" = "True" ] && { echo "::error::job/$job Failed"; return 1; }
              [ "$elapsed" -ge "$timeout" ] && { echo "::error::job/$job timed out after ${timeout}s"; return 1; }
              sleep 10; elapsed=$((elapsed + 10))
            done
          }
          envsubst '${PGCYAN_IMAGE}' < deploy/k8s/25-job-collect-inputs.yaml | kubectl apply -f -
          wait_job pgcyan-collect-inputs 900

      # Applied only after the collector succeeds -- this is the DAG edge the
      # orchestrator would otherwise enforce. If the source has ANY large object,
      # the planner's LOB abort gate exits non-zero and this barrier fails with NO
      # plan written -- that is the correct, expected outcome, not a workflow bug.
      - name: Phase -1 -- plan (barrier)
        run: |
          set -euo pipefail
          wait_job() {
            local job="$1" timeout="${2:-900}" elapsed=0 done_s fail_s
            echo "waiting for job/$job (timeout ${timeout}s) ..."
            while true; do
              done_s=$(kubectl get job "$job" -n "$NS" -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null || true)
              fail_s=$(kubectl get job "$job" -n "$NS" -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || true)
              [ "$done_s" = "True" ] && { echo "job/$job Complete"; return 0; }
              [ "$fail_s" = "True" ] && { echo "::error::job/$job Failed (LOB abort gate is one legitimate cause)"; return 1; }
              [ "$elapsed" -ge "$timeout" ] && { echo "::error::job/$job timed out after ${timeout}s"; return 1; }
              sleep 10; elapsed=$((elapsed + 10))
            done
          }
          envsubst '${PGCYAN_IMAGE}' < deploy/k8s/30-job-planner.yaml | kubectl apply -f -
          wait_job pgcyan-planner 900

      # Always collect evidence -- especially on failure (LOB abort / DB error).
      - name: Gather plan + logs
        if: always()
        run: |
          mkdir -p planner-output
          kubectl logs -l pgcyan.dev/phase=collect-inputs -n "$NS" --tail=-1 \
            > planner-output/collect-inputs.log 2>&1 || true
          kubectl logs -l pgcyan.dev/phase=planner -n "$NS" --tail=-1 \
            > planner-output/planner.log 2>&1 || true
          kubectl get configmap pgcyan-plan -n "$NS" \
            -o go-template='{{range $k, $v := .data}}{{$k}}{{"\n"}}{{$v}}{{"\n"}}{{end}}' \
            > planner-output/pgcyan-plan.txt 2>/dev/null || echo "pgcyan-plan ConfigMap not present" > planner-output/pgcyan-plan.txt
          kubectl get configmap pgcyan-plan -n "$NS" \
            -o jsonpath='{.data.plan\.json}' > planner-output/plan.json 2>/dev/null || true
          echo "---- planner-output ----" && ls -la planner-output

      - name: Upload plan + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgcyan-plan-${{ github.run_id }}
          path: planner-output/*
          if-no-files-found: warn
          retention-days: 30

  snapshot-holder:
    name: Establish, verify, then gracefully tear down the snapshot holder (phase 1)
    runs-on: ubuntu-latest
    environment: azure
    env:
      DEPLOY: pgcyan-snapshot-holder
      AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
      AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Guard -- require Azure + AKS + source-DB config
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          PG_SOURCE_USER: ${{ secrets.PG_SOURCE_USER }}
          PG_SOURCE_PASSWORD: ${{ secrets.PG_SOURCE_PASSWORD }}
          PG_SOURCE_HOST: ${{ vars.PG_SOURCE_HOST }}
          PG_SOURCE_DATABASE: ${{ vars.PG_SOURCE_DATABASE }}
        run: |
          missing=()
          [ -z "${AZURE_CLIENT_ID}" ]     && missing+=("AZURE_CLIENT_ID secret")
          [ -z "${AKS_RESOURCE_GROUP}" ]  && missing+=("AKS_RESOURCE_GROUP variable")
          [ -z "${AKS_CLUSTER_NAME}" ]    && missing+=("AKS_CLUSTER_NAME variable")
          [ -z "${PG_SOURCE_USER}" ]      && missing+=("PG_SOURCE_USER secret")
          [ -z "${PG_SOURCE_PASSWORD}" ]  && missing+=("PG_SOURCE_PASSWORD secret")
          [ -z "${PG_SOURCE_HOST}" ]      && missing+=("PG_SOURCE_HOST variable")
          [ -z "${PG_SOURCE_DATABASE}" ]  && missing+=("PG_SOURCE_DATABASE variable")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::%s not set -- configure it before running (see workflow header).\n' "${missing[@]}"
            exit 1
          fi

      - name: Resolve the pgcyan image (commit short SHA)
        run: |
          echo "PGCYAN_IMAGE=${ACR_NAME}.azurecr.io/pgcyan:$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Azure login (OIDC, passwordless)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      - name: Ensure namespace + RBAC + work-dir PVC
        run: |
          kubectl apply -f deploy/k8s/00-namespace.yaml
          kubectl apply -f deploy/k8s/01-rbac.yaml
          kubectl apply -f deploy/k8s/20-pvc-workdir.yaml

      # The holder reads pgcopydb's native PGCOPYDB_SOURCE_PGURI from the
      # `pgcyan-db-uris` Secret. Build it from the same PG_SOURCE_* GitHub
      # secrets/variables; never in git. Azure Postgres requires TLS ->
      # sslmode=require. (A target URI is not needed for phase 1 -- the holder
      # only touches the source -- but the key is set empty so the Secret shape
      # matches 10-secrets.example.yaml.)
      - name: Create/refresh source-DB Secret (PGCOPYDB_SOURCE_PGURI)
        env:
          PG_SOURCE_HOST: ${{ vars.PG_SOURCE_HOST }}
          PG_SOURCE_PORT: ${{ vars.PG_SOURCE_PORT }}
          PG_SOURCE_USER: ${{ secrets.PG_SOURCE_USER }}
          PG_SOURCE_PASSWORD: ${{ secrets.PG_SOURCE_PASSWORD }}
          PG_SOURCE_DATABASE: ${{ vars.PG_SOURCE_DATABASE }}
        run: |
          port="${PG_SOURCE_PORT:-5432}"
          # URL-encode the user/password so special characters survive the URI.
          enc() { python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$1"; }
          u="$(enc "$PG_SOURCE_USER")"; p="$(enc "$PG_SOURCE_PASSWORD")"
          uri="postgres://${u}:${p}@${PG_SOURCE_HOST}:${port}/${PG_SOURCE_DATABASE}?sslmode=require"
          kubectl create secret generic pgcyan-db-uris -n "$NS" \
            --from-literal=PGCOPYDB_SOURCE_PGURI="$uri" \
            --from-literal=PGCOPYDB_TARGET_PGURI="" \
            --dry-run=client -o yaml | kubectl apply -f -

      # Start clean so a leftover holder from a prior run can't mask a fresh
      # snapshot (its /work/coordinator/snapshot would be stale).
      - name: Clear any prior holder
        run: |
          envsubst '${PGCYAN_IMAGE}' < deploy/k8s/50-deployment-snapshot-holder.yaml \
            | kubectl delete -f - -n "$NS" --ignore-not-found --wait=true

      - name: Apply the snapshot holder
        run: envsubst '${PGCYAN_IMAGE}' < deploy/k8s/50-deployment-snapshot-holder.yaml | kubectl apply -f -

      # The readiness probe passes only once source-pg-slot.json exists, so a
      # ready replica == publication + slot + consistent snapshot all established.
      - name: Wait for the holder to establish + become ready
        run: |
          set -euo pipefail
          echo "waiting for the holder pod to be Running ..."
          kubectl wait --for=condition=Ready pod \
            -l pgcyan.dev/phase=snapshot-holder -n "$NS" --timeout=300s
          echo "waiting for the Deployment to report an available replica ..."
          kubectl rollout status deploy/"$DEPLOY" -n "$NS" --timeout=300s

      # Acceptance: the outputs must be visible on the shared /work volume.
      - name: Verify outputs on /work
        run: |
          set -euo pipefail
          pod="$(kubectl get pod -l pgcyan.dev/phase=snapshot-holder -n "$NS" \
                   -o jsonpath='{.items[0].metadata.name}')"
          echo "holder pod: $pod"
          echo "---- /work/coordinator ----"
          kubectl exec "$pod" -n "$NS" -- ls -la /work/coordinator
          for f in source-pg-slot.json source-pg-publication.json snapshot; do
            echo "asserting /work/coordinator/$f is present and non-empty ..."
            kubectl exec "$pod" -n "$NS" -- test -s "/work/coordinator/$f"
          done
          echo "---- source-pg-slot.json ----"
          kubectl exec "$pod" -n "$NS" -- cat /work/coordinator/source-pg-slot.json
          echo "---- source-pg-publication.json ----"
          kubectl exec "$pod" -n "$NS" -- cat /work/coordinator/source-pg-publication.json

      # Grab the outputs + logs BEFORE teardown, for the artifact.
      - name: Collect outputs + establish logs
        if: always()
        run: |
          mkdir -p snapshot-output
          pod="$(kubectl get pod -l pgcyan.dev/phase=snapshot-holder -n "$NS" \
                   -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
          if [ -n "${pod:-}" ]; then
            for f in source-pg-slot.json source-pg-publication.json snapshot; do
              kubectl exec "$pod" -n "$NS" -- cat "/work/coordinator/$f" \
                > "snapshot-output/$f" 2>/dev/null || true
            done
          fi
          kubectl logs -l pgcyan.dev/phase=snapshot-holder -n "$NS" --tail=-1 \
            > snapshot-output/holder.log 2>&1 || true
          ls -la snapshot-output

      # Graceful teardown: deleting the Deployment SIGTERMs the pod; the wrapper
      # then SIGTERMs pgcopydb, which closes the replication connection cleanly
      # within terminationGracePeriodSeconds (60s). --cascade=foreground blocks
      # until the owned pod is actually gone, then wait explicitly as a
      # belt-and-braces guard (timeout > the 60s grace period).
      - name: Gracefully shut the holder down
        run: |
          set -euo pipefail
          kubectl delete deploy/"$DEPLOY" -n "$NS" \
            --cascade=foreground --wait=true --timeout=120s
          kubectl delete pdb/pgcyan-snapshot-holder -n "$NS" --ignore-not-found
          echo "waiting for the holder pod to fully terminate ..."
          # --for=delete exits non-zero with "no matching resources" if the pod
          # is already gone -- that's the success case, so tolerate it and let
          # the assertion below be the real gate.
          kubectl wait --for=delete pod \
            -l pgcyan.dev/phase=snapshot-holder -n "$NS" --timeout=90s || true
          echo "verifying no pod remains ..."
          kubectl get pod -l pgcyan.dev/phase=snapshot-holder -n "$NS" 2>&1 | tee /tmp/pods.txt
          grep -q "No resources found" /tmp/pods.txt \
            || [ -z "$(kubectl get pod -l pgcyan.dev/phase=snapshot-holder -n "$NS" -o name)" ]

      # Confirm the shutdown was graceful (the wrapper logged the clean stop),
      # not a SIGKILL -- this is what proves the source connection was released.
      - name: Assert graceful shutdown in the logs
        run: |
          set -euo pipefail
          if grep -q "terminating the snapshot holder" snapshot-output/holder.log \
             || grep -q "source connection released" snapshot-output/holder.log; then
            echo "graceful shutdown confirmed"
          else
            echo "::warning::did not observe the graceful-shutdown log line (pod logs may have rotated on delete)"
          fi

      - name: Upload holder outputs + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgcyan-snapshot-holder-${{ github.run_id }}
          path: snapshot-output/*
          if-no-files-found: warn
          retention-days: 30
