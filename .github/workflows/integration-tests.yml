name: Integration tests

# Manual, cluster-backed integration tests. Runs on the AKS cluster against a
# real source database, so it is `workflow_dispatch` only and never on push/PR.
# It picks the image up by the COMMIT SHORT SHA (built + pushed by build.yml for
# the same commit) and fills the `image: "${PGCYAN_IMAGE}"` placeholder in the
# deploy/k8s manifests via `envsubst '${PGCYAN_IMAGE}'` before `kubectl apply`
# (only that variable is substituted, leaving runtime `$(SNAPSHOT_ID)` /
# `${RESTORE_JOBS}` refs intact).
#
# ONE job, `migration`, runs the whole implemented pipeline end-to-end via the
# folded controller -- no per-step jobs, no parallelism, no shared-object race.
# It runs the the collect step collector (barrier), then stands up the controller
# StatefulSet with PGCYAN_FOLLOW_CDC=true: the controller holds the consistent
# snapshot in-pod and walks plan -> schema -> copy -> indexes -> foreign-keys,
# then itself becomes the CDC consumer (`pgcopydb follow --resume` on its own
# --dir, so follow reuses the slot). It then asserts: the combined pgcyan-copylog
# ConfigMap is a `completed` copy with per-table row counts; the target has
# tables + data + secondary indexes + PK/unique constraints + validated FKs; CDC
# streams with exactly one active consumer on the slot; a source insert actually
# replicates to the target; and the controller shuts down gracefully on SIGTERM
# (no SIGKILL, source slot released). See also: pg_cyan/controller.py,
# pg_cyan/follow.py.
#
# ---------------------------------------------------------------------------
# PREREQUISITES (all one-time):
#   * terraform/aks applied (cluster + ACR + workload identities).
#   * build.yml has published pgcyan:<short-sha> for the commit being tested.
#   * The controller holds the snapshot in a node-local emptyDir (no PVC); the
#     data shards need a dynamic RWO managed-disk StorageClass (managed-csi).
#   * The SOURCE server allows logical replication (wal_level=logical), the login
#     role can CREATE PUBLICATION FOR ALL TABLES + a replication slot, and the
#     source actually CONTAINS TABLES (with data) for the copy to be meaningful.
#   * A REAL TARGET Postgres the controller can write schema + data to, with the
#     target roles pre-created (so `--no-owner` applies) and the login role
#     allowed to CREATE tables/sequences.
#   * GitHub config:
#       secrets:  AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID
#                 PG_SOURCE_USER / PG_SOURCE_PASSWORD
#                 PG_TARGET_USER / PG_TARGET_PASSWORD
#       variables: AKS_RESOURCE_GROUP / AKS_CLUSTER_NAME
#                  PG_SOURCE_HOST / PG_SOURCE_PORT / PG_SOURCE_DATABASE
#                  PG_TARGET_HOST / PG_TARGET_PORT / PG_TARGET_DATABASE
#                  ACR_NAME (optional; defaults to pgcyanacr)
#     (Credentials are secrets; non-sensitive host/port/db are plain variables.)
#
# SECRETS POLICY: source-DB credentials live ONLY as GitHub secrets and are
# materialized into an in-cluster Secret at apply time -- no vault, nothing in
# git. (Azure Key Vault + CSI is a later hardening step.)
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:

permissions:
  id-token: write   # OIDC token for azure/login
  contents: read
  actions: write    # dispatch build.yml if the commit's image is missing (below)

env:
  NS: pgcyan-migration
  ACR_NAME: ${{ vars.ACR_NAME || 'pgcyanacr' }}

jobs:
  migration:
    name: End-to-end migration via the folded controller, walk + controller-owned CDC
    runs-on: ubuntu-latest
    environment: azure
    # ONE job, no parallelism -- the folded controller walks the WHOLE implemented
    # DAG in-pod (plan -> schema -> copy), so there is nothing to
    # serialize against and no shared-object race. Runs the real production code
    # path end-to-end.
    env:
      AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
      AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
      # Run the WHOLE walk (plan -> foreign-keys; PGCYAN_STOP_AFTER empty) and then
      # stream CDC: after the walk the controller releases the snapshot and becomes
      # the `pgcopydb follow` consumer on its own --dir, staying Ready.
      PGCYAN_STOP_AFTER: ""
      PGCYAN_FOLLOW_CDC: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The controller holds the snapshot (source) AND pre-data writes the TARGET,
      # so it needs both DB configs plus Azure/AKS.
      - name: Guard -- require Azure + AKS + source + target DB config
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          PG_SOURCE_USER: ${{ secrets.PG_SOURCE_USER }}
          PG_SOURCE_PASSWORD: ${{ secrets.PG_SOURCE_PASSWORD }}
          PG_SOURCE_HOST: ${{ vars.PG_SOURCE_HOST }}
          PG_SOURCE_DATABASE: ${{ vars.PG_SOURCE_DATABASE }}
          PG_TARGET_USER: ${{ secrets.PG_TARGET_USER }}
          PG_TARGET_PASSWORD: ${{ secrets.PG_TARGET_PASSWORD }}
          PG_TARGET_HOST: ${{ vars.PG_TARGET_HOST }}
          PG_TARGET_DATABASE: ${{ vars.PG_TARGET_DATABASE }}
        run: |
          missing=()
          [ -z "${AZURE_CLIENT_ID}" ]     && missing+=("AZURE_CLIENT_ID secret")
          [ -z "${AKS_RESOURCE_GROUP}" ]  && missing+=("AKS_RESOURCE_GROUP variable")
          [ -z "${AKS_CLUSTER_NAME}" ]    && missing+=("AKS_CLUSTER_NAME variable")
          [ -z "${PG_SOURCE_USER}" ]      && missing+=("PG_SOURCE_USER secret")
          [ -z "${PG_SOURCE_PASSWORD}" ]  && missing+=("PG_SOURCE_PASSWORD secret")
          [ -z "${PG_SOURCE_HOST}" ]      && missing+=("PG_SOURCE_HOST variable")
          [ -z "${PG_SOURCE_DATABASE}" ]  && missing+=("PG_SOURCE_DATABASE variable")
          [ -z "${PG_TARGET_USER}" ]      && missing+=("PG_TARGET_USER secret")
          [ -z "${PG_TARGET_PASSWORD}" ]  && missing+=("PG_TARGET_PASSWORD secret")
          [ -z "${PG_TARGET_HOST}" ]      && missing+=("PG_TARGET_HOST variable")
          [ -z "${PG_TARGET_DATABASE}" ]  && missing+=("PG_TARGET_DATABASE variable")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::%s not set -- configure it before running (see workflow header).\n' "${missing[@]}"
            exit 1
          fi

      - name: Resolve the pgcyan image (commit short SHA)
        run: echo "PGCYAN_IMAGE=${ACR_NAME}.azurecr.io/pgcyan:$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Azure login (OIDC, passwordless)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The image is tagged by the branch's HEAD short SHA, but build.yml only
      # publishes on push-to-main / manual dispatch -- so a feature-branch commit
      # has NO image until we build one. Ensure it exists
      # BEFORE the controller pod tries to pull it (else ImagePullBackOff): if the
      # tag is absent, dispatch build.yml on THIS branch (its publish job tags by
      # the same `git rev-parse --short HEAD`) and wait for the tag to appear.
      - name: Ensure the commit's image is published (build if missing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse --short HEAD)"
          echo "Required image: ${ACR_NAME}.azurecr.io/pgcyan:${sha}"
          if az acr repository show --name "$ACR_NAME" --image "pgcyan:${sha}" >/dev/null 2>&1; then
            echo "Image already present -- nothing to build."
            exit 0
          fi
          echo "Image pgcyan:${sha} not found; dispatching Build on ${GITHUB_REF_NAME} ..."
          gh workflow run build.yml --ref "$GITHUB_REF_NAME"
          # ACR Tasks builds server-side (a few minutes); poll for the tag to land.
          timeout=1500; elapsed=0
          until az acr repository show --name "$ACR_NAME" --image "pgcyan:${sha}" >/dev/null 2>&1; do
            if [ "$elapsed" -ge "$timeout" ]; then
              echo "::error::image pgcyan:${sha} still absent after ${timeout}s -- check the Build workflow run on ${GITHUB_REF_NAME}"
              exit 1
            fi
            echo "waiting for pgcyan:${sha} to publish ... (${elapsed}s)"
            sleep 20; elapsed=$((elapsed + 20))
          done
          echo "Image pgcyan:${sha} is published."

      - name: Get AKS credentials
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      - name: Ensure namespace + RBAC + work-dir PVC
        run: |
          kubectl apply -f deploy/k8s/00-namespace.yaml
          kubectl apply -f deploy/k8s/01-rbac.yaml
          kubectl apply -f deploy/k8s/20-pvc-workdir.yaml

      - name: Create/refresh DB Secret (SOURCE + TARGET PGURIs)
        env:
          PG_SOURCE_HOST: ${{ vars.PG_SOURCE_HOST }}
          PG_SOURCE_PORT: ${{ vars.PG_SOURCE_PORT }}
          PG_SOURCE_USER: ${{ secrets.PG_SOURCE_USER }}
          PG_SOURCE_PASSWORD: ${{ secrets.PG_SOURCE_PASSWORD }}
          PG_SOURCE_DATABASE: ${{ vars.PG_SOURCE_DATABASE }}
          PG_TARGET_HOST: ${{ vars.PG_TARGET_HOST }}
          PG_TARGET_PORT: ${{ vars.PG_TARGET_PORT }}
          PG_TARGET_USER: ${{ secrets.PG_TARGET_USER }}
          PG_TARGET_PASSWORD: ${{ secrets.PG_TARGET_PASSWORD }}
          PG_TARGET_DATABASE: ${{ vars.PG_TARGET_DATABASE }}
        run: |
          enc() { python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$1"; }
          sport="${PG_SOURCE_PORT:-5432}"; tport="${PG_TARGET_PORT:-5432}"
          su="$(enc "$PG_SOURCE_USER")"; sp="$(enc "$PG_SOURCE_PASSWORD")"
          tu="$(enc "$PG_TARGET_USER")"; tp="$(enc "$PG_TARGET_PASSWORD")"
          source_uri="postgres://${su}:${sp}@${PG_SOURCE_HOST}:${sport}/${PG_SOURCE_DATABASE}?sslmode=require"
          target_uri="postgres://${tu}:${tp}@${PG_TARGET_HOST}:${tport}/${PG_TARGET_DATABASE}?sslmode=require"
          kubectl create secret generic pgcyan-db-uris -n "$NS" \
            --from-literal=PGCOPYDB_SOURCE_PGURI="$source_uri" \
            --from-literal=PGCOPYDB_TARGET_PGURI="$target_uri" \
            --dry-run=client -o yaml | kubectl apply -f -

      # Clean slate: the controller owns (owner-ref) the step Jobs/PVCs it
      # creates, so deleting its StatefulSet cascade-deletes them; also drop the
      # run-state marker (else a fresh controller refuses-to-resume), the plan +
      # combined/per-shard copy logs, and the the collect step collector + target-check Job.
      - name: Clear prior controller run
        run: |
          kubectl delete statefulset pgcyan-controller -n "$NS" --ignore-not-found --wait=true --cascade=foreground || true
          kubectl delete configmap -n "$NS" --ignore-not-found \
            pgcyan-migration-state pgcyan-plan pgcyan-copylog pgcyan-snapshot || true
          # per-shard copy-log ConfigMaps are written by the worker (no owner-ref),
          # so clear them by label or they leak into the next run's aggregation.
          kubectl delete configmap -n "$NS" --ignore-not-found -l pgcyan.dev/copylog=shard || true
          kubectl delete job -n "$NS" --ignore-not-found --wait=true \
            pgcyan-collect-inputs pgcyan-target-check pgcyan-cdc-check pgcyan-cdc-roundtrip || true
          kubectl delete pvc -n "$NS" --ignore-not-found --wait=false -l pgcyan.dev/step=data || true
          # the controller's own --dir PVC (volumeClaimTemplate; not cascaded by the
          # StatefulSet delete) -- clear it so this run gets a fresh --dir.
          kubectl delete pvc -n "$NS" --ignore-not-found --wait=false -l pgcyan.dev/component=controller || true

      # the collect step (collect inputs) is NOT part of the controller walk (which starts
      # at the planner, -1); run it + barrier first so the planner has its inputs.
      - name: the collect step -- collect inputs (barrier)
        run: |
          set -euo pipefail
          wait_job() {
            local job="$1" timeout="${2:-900}" elapsed=0 done_s fail_s
            while true; do
              done_s=$(kubectl get job "$job" -n "$NS" -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null || true)
              fail_s=$(kubectl get job "$job" -n "$NS" -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || true)
              [ "$done_s" = "True" ] && { echo "job/$job Complete"; return 0; }
              [ "$fail_s" = "True" ] && { echo "::error::job/$job Failed"; return 1; }
              [ "$elapsed" -ge "$timeout" ] && { echo "::error::job/$job timed out"; return 1; }
              sleep 10; elapsed=$((elapsed + 10))
            done
          }
          envsubst '${PGCYAN_IMAGE}' < deploy/k8s/25-job-collect-inputs.yaml | kubectl apply -f -
          wait_job pgcyan-collect-inputs 900

      # Apply the controller StatefulSet. envsubst bakes the image + PGCYAN_STOP_AFTER
      # (empty = full walk) + PGCYAN_FOLLOW_CDC (=true, stream CDC after the walk)
      # into the pod env at apply time. (Setting env post-apply would roll the pod
      # and trip the refuse-to-resume guard, hence baking it in.)
      - name: Apply the migration controller (walk + controller-owned CDC)
        run: |
          set -euo pipefail
          envsubst '${PGCYAN_IMAGE} ${PGCYAN_STOP_AFTER} ${PGCYAN_FOLLOW_CDC} ${PGCYAN_FOLLOW_VERBOSE}' \
            < deploy/k8s/35-statefulset-controller.yaml | kubectl apply -f -

      # Completion signal is the run-state marker the controller patches, NOT
      # pod readiness (which flips Ready as soon as the snapshot is established,
      # before the walk finishes). Poll until it reaches a terminal status.
      # 30min: the data copy (the copy step) is heavier than schema-only.
      - name: Wait for the controller to finish the walk (run-state)
        run: |
          set -euo pipefail
          timeout=1800; elapsed=0
          while true; do
            st=$(kubectl get configmap pgcyan-migration-state -n "$NS" -o jsonpath='{.data.status}' 2>/dev/null || true)
            echo "run-state: ${st:-<none>}"
            [ "$st" = "succeeded" ] && break
            if [ "$st" = "failed" ]; then
              echo "::error::controller reported run-state=failed"
              kubectl logs -l pgcyan.dev/component=controller -n "$NS" --tail=-1 || true
              exit 1
            fi
            [ "$elapsed" -ge "$timeout" ] && { echo "::error::timed out waiting for run-state=succeeded"; \
              kubectl logs -l pgcyan.dev/component=controller -n "$NS" --tail=-1 || true; exit 1; }
            sleep 15; elapsed=$((elapsed + 15))
          done

      # ACCEPTANCE: the orchestrator aggregated the per-shard copy logs into
      # the combined pgcyan-copylog ConfigMap -- a `completed` copy with the slot
      # name and per-table row counts.
      - name: Assert the combined copy log (pgcyan-copylog)
        run: |
          set -euo pipefail
          kubectl get configmap pgcyan-copylog -n "$NS" \
            -o jsonpath='{.data.migration-copy-log\.json}' > /tmp/copylog.json \
            || { echo "::error::pgcyan-copylog ConfigMap not found (collect-step aggregation did not run)"; exit 1; }
          echo "---- migration-copy-log.json ----" && cat /tmp/copylog.json
          python3 - <<'PY'
          import json, sys
          log = json.load(open("/tmp/copylog.json"))
          errs = []
          if log.get("status") != "completed":
              errs.append(f"status is {log.get('status')!r}, expected 'completed'")
          if not log.get("slot"):
              errs.append("slot name is empty")
          if not isinstance(log.get("row_count_total"), int):
              errs.append(f"row_count_total is not an int: {log.get('row_count_total')!r}")
          if log.get("shard_count", 0) < 1:
              errs.append(f"shard_count is {log.get('shard_count')!r}, expected >= 1")
          if not isinstance(log.get("tables"), dict):
              errs.append("no per-table map present")
          if errs:
              for e in errs: print(f"::error::copy log invalid: {e}")
              sys.exit(1)
          print(f"copy log OK: {log['shard_count']} shard(s), {len(log['tables'])} tables, "
                f"{log['row_count_total']} rows, slot={log['slot']}")
          PY

      # ACCEPTANCE: after the post-data steps the target has tables + data + secondary
      # indexes + PK/unique constraints (built by the indexes step build-indexes) + ALL
      # foreign keys VALIDATED (NOT VALID then VALIDATE).
      # Checked in-cluster (target unreachable from the runner) with the target URI.
      - name: Verify target post-data shape (indexes + PK/unique + validated FKs)
        run: |
          set -euo pipefail
          kubectl delete job pgcyan-target-check -n "$NS" --ignore-not-found --wait=true
          cat <<'EOF' | envsubst '${PGCYAN_IMAGE}' | kubectl apply -n "$NS" -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: pgcyan-target-check
            labels: { pgcyan.dev/step: "controller-check" }
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 3600
            template:
              metadata:
                labels: { pgcyan.dev/step: "controller-check" }
              spec:
                serviceAccountName: pgcyan-worker
                restartPolicy: Never
                containers:
                  - name: check
                    image: "${PGCYAN_IMAGE}"
                    envFrom:
                      - secretRef: { name: pgcyan-db-uris }
                    command: ["sh", "-c"]
                    args:
                      - |
                        psql "$PGCOPYDB_TARGET_PGURI" -tA -v ON_ERROR_STOP=1 -c "SELECT 'RESULT'||' tables='||(SELECT count(*) FROM pg_tables WHERE schemaname NOT IN ('pg_catalog','information_schema'))||' indexes='||(SELECT count(*) FROM pg_indexes WHERE schemaname NOT IN ('pg_catalog','information_schema'))||' pkuq='||(SELECT count(*) FROM pg_constraint c JOIN pg_namespace n ON n.oid=c.connamespace WHERE c.contype IN ('p','u') AND n.nspname NOT IN ('pg_catalog','information_schema'))||' fks='||(SELECT count(*) FROM pg_constraint c JOIN pg_namespace n ON n.oid=c.connamespace WHERE c.contype='f' AND n.nspname NOT IN ('pg_catalog','information_schema'))||' fksvalid='||(SELECT count(*) FROM pg_constraint c JOIN pg_namespace n ON n.oid=c.connamespace WHERE c.contype='f' AND c.convalidated AND n.nspname NOT IN ('pg_catalog','information_schema'))"
          EOF
          kubectl wait --for=condition=complete job/pgcyan-target-check -n "$NS" --timeout=120s \
            || { kubectl logs job/pgcyan-target-check -n "$NS" || true; echo "::error::target check did not complete"; exit 1; }
          line="$(kubectl logs job/pgcyan-target-check -n "$NS" --tail=-1 | grep -o 'RESULT tables=[0-9]* indexes=[0-9]* pkuq=[0-9]* fks=[0-9]* fksvalid=[0-9]*' | tail -1)"
          echo "target post-data counts: [$line]"
          tables=$(echo "$line" | sed -E 's/.*tables=([0-9]+).*/\1/')
          indexes=$(echo "$line" | sed -E 's/.*indexes=([0-9]+).*/\1/')
          pkuq=$(echo "$line" | sed -E 's/.*pkuq=([0-9]+).*/\1/')
          fks=$(echo "$line" | sed -E 's/.* fks=([0-9]+).*/\1/')
          fksvalid=$(echo "$line" | sed -E 's/.*fksvalid=([0-9]+).*/\1/')
          fail=0
          [ "${tables:-0}" -gt 0 ]      || { echo "::error::expected tables > 0, got ${tables:-}"; fail=1; }
          [ "${indexes:-0}" -gt 0 ]     || { echo "::error::expected secondary indexes > 0 (the indexes step), got ${indexes:-}"; fail=1; }
          [ "${pkuq:-0}" -gt 0 ]        || { echo "::error::expected PK/unique constraints > 0 (the indexes step build-indexes), got ${pkuq:-}"; fail=1; }
          [ "${fks:-0}" -gt 0 ]         || { echo "::error::expected FKs > 0 (the foreign-keys step; source must have FKs), got ${fks:-}"; fail=1; }
          [ "${fksvalid:-0}" = "${fks:-1}" ] || { echo "::error::expected ALL FKs validated, got ${fksvalid:-}/${fks:-}"; fail=1; }
          [ "$fail" -eq 0 ] || exit 1
          echo "target post-data OK: $tables tables, $indexes indexes, $pkuq PK/unique, $fks FKs ($fksvalid validated)"

      # ACCEPTANCE: after the follow step the CDC consumer is streaming -- exactly ONE
      # active consumer on the SOURCE slot (the controller released its snapshot so
      # `pgcopydb follow` could attach), and migration-cdc-log.json says `streaming`.
      # Checked in-cluster (source URI from the secret).
      - name: Verify CDC is streaming (one active consumer on the slot)
        run: |
          set -euo pipefail
          kubectl delete job pgcyan-cdc-check -n "$NS" --ignore-not-found --wait=true
          cat <<'EOF' | envsubst '${PGCYAN_IMAGE}' | kubectl apply -n "$NS" -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: pgcyan-cdc-check
            labels: { pgcyan.dev/step: "controller-check" }
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 3600
            template:
              metadata:
                labels: { pgcyan.dev/step: "controller-check" }
              spec:
                serviceAccountName: pgcyan-worker
                restartPolicy: Never
                containers:
                  - name: check
                    image: "${PGCYAN_IMAGE}"
                    envFrom:
                      - secretRef: { name: pgcyan-db-uris }
                    command: ["sh", "-c"]
                    args:
                      - |
                        psql "$PGCOPYDB_SOURCE_PGURI" -tA -v ON_ERROR_STOP=1 -c "SELECT 'CDC'||' slots='||(SELECT count(*) FROM pg_replication_slots WHERE slot_type='logical')||' active='||(SELECT count(*) FROM pg_replication_slots WHERE slot_type='logical' AND active)"
          EOF
          kubectl wait --for=condition=complete job/pgcyan-cdc-check -n "$NS" --timeout=120s \
            || { kubectl logs job/pgcyan-cdc-check -n "$NS" || true; echo "::error::CDC check did not complete"; exit 1; }
          line="$(kubectl logs job/pgcyan-cdc-check -n "$NS" --tail=-1 | grep -o 'CDC slots=[0-9]* active=[0-9]*' | tail -1)"
          echo "CDC slot state: [$line]"
          slots=$(echo "$line" | sed -E 's/.*slots=([0-9]+).*/\1/')
          active=$(echo "$line" | sed -E 's/.*active=([0-9]+).*/\1/')
          fail=0
          [ "${slots:-0}" -ge 1 ]  || { echo "::error::expected a logical slot, got ${slots:-}"; fail=1; }
          [ "${active:-0}" -eq 1 ] || { echo "::error::expected exactly 1 ACTIVE consumer on the slot (the controller's follow), got ${active:-}"; fail=1; }
          # The consumer is the CONTROLLER pod itself -- its follow
          # events + migration-cdc-log.json land in the collected controller.log.
          [ "$fail" -eq 0 ] || exit 1
          echo "CDC OK: $slots logical slot(s), $active active consumer -- streaming"

      # ACCEPTANCE (the strong one): prove CDC actually REPLICATES a live
      # change end-to-end, not just that a consumer is attached. Insert a uniquely
      # marked sentinel row on the SOURCE, then poll the TARGET until it appears --
      # exercising the full receive -> transform -> apply loop (the apply half is the
      # real unknown). CDC is async, so this is a bounded poll, not a single query.
      # Runs in-cluster (both DBs reachable only from inside). On timeout it dumps
      # the controller's CDC log for diagnosis.
      - name: Verify CDC replicates a live change (source insert -> target)
        run: |
          set -euo pipefail
          export PROBE="cdc-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "CDC round-trip probe: $PROBE"
          kubectl delete job pgcyan-cdc-roundtrip -n "$NS" --ignore-not-found --wait=true
          cat <<'EOF' | envsubst '${PGCYAN_IMAGE} ${PROBE}' | kubectl apply -n "$NS" -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: pgcyan-cdc-roundtrip
            labels: { pgcyan.dev/step: "controller-check" }
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 3600
            template:
              metadata:
                labels: { pgcyan.dev/step: "controller-check" }
              spec:
                serviceAccountName: pgcyan-worker
                restartPolicy: Never
                containers:
                  - name: roundtrip
                    image: "${PGCYAN_IMAGE}"
                    envFrom:
                      - secretRef: { name: pgcyan-db-uris }
                    env:
                      - name: PROBE
                        value: "${PROBE}"
                    command: ["sh", "-c"]
                    args:
                      - |
                        set -e
                        # Insert a new row on the source (customers has no FK parent).
                        # A hard failure here means the test setup is broken, not CDC.
                        psql "$PGCOPYDB_SOURCE_PGURI" -v ON_ERROR_STOP=1 -c \
                          "INSERT INTO public.customers (email, region) VALUES ('$PROBE', 'cdc')"
                        echo "inserted $PROBE on source; polling target (<=30s)..."
                        i=0
                        while [ "$i" -lt 10 ]; do
                          n=$(psql "$PGCOPYDB_TARGET_PGURI" -tAc \
                            "SELECT count(*) FROM public.customers WHERE email = '$PROBE'" 2>/dev/null || echo 0)
                          if [ "$n" = "1" ]; then echo "ROUNDTRIP found after ~$((i*3))s"; break; fi
                          i=$((i+1)); sleep 3
                        done
                        # Tidy up probe rows on the source (best-effort; CDC
                        # replicates the delete too). Then report the outcome.
                        psql "$PGCOPYDB_SOURCE_PGURI" -c \
                          "DELETE FROM public.customers WHERE email LIKE 'cdc-probe-%'" >/dev/null 2>&1 || true
                        [ "${n:-0}" = "1" ] && exit 0
                        echo "ROUNDTRIP notfound after 30s"; exit 1
          EOF
          # FATAL: the sequence-sync step (2s) advances the target identity
          # sequences after the copy, and the pgcopydb fork flushes the apply
          # pipeline on drain, so a live source insert must appear on the target
          # within the window. If it does not, that is a real regression -- dump
          # the controller CDC log for diagnosis.
          if ! kubectl wait --for=condition=complete job/pgcyan-cdc-roundtrip -n "$NS" --timeout=90s; then
            echo "::error::CDC did not replicate the probe row within 30s (regression? check the apply pipeline flush and the sequence sync)"
            kubectl logs job/pgcyan-cdc-roundtrip -n "$NS" --tail=-1 || true
            echo "--- controller CDC log (last 200) ---"
            kubectl logs -l pgcyan.dev/component=controller -n "$NS" --tail=200 || true
            exit 1
          fi
          kubectl logs job/pgcyan-cdc-roundtrip -n "$NS" --tail=-1 | grep -q "ROUNDTRIP found"
          echo "CDC replication OK: a source insert appeared on the target"

      - name: Collect controller + step logs
        if: always()
        run: |
          mkdir -p migration-output
          # The controller streams CDC in-pod (Option A), so its follow events are
          # in controller.log; there is no separate `cdc` pod.
          kubectl logs -l pgcyan.dev/component=controller -n "$NS" --tail=-1 > migration-output/controller.log 2>&1 || true
          for step in collect-inputs planner pre-data data sequences post-data-index post-data-fk controller-check; do
            kubectl logs -l pgcyan.dev/step="$step" -n "$NS" --tail=-1 --prefix > "migration-output/${step}.log" 2>&1 || true
          done
          kubectl get configmap pgcyan-migration-state -n "$NS" -o yaml > migration-output/run-state.yaml 2>/dev/null || true
          kubectl get configmap pgcyan-copylog -n "$NS" -o jsonpath='{.data.migration-copy-log\.json}' > migration-output/migration-copy-log.json 2>/dev/null || true
          ls -la migration-output

      # ACCEPTANCE: the controller must shut down GRACEFULLY -- on SIGTERM it
      # stops the CDC `follow` child cleanly (releasing the source replication
      # connection) within the pod grace window, NOT get SIGKILLed. We scale the
      # StatefulSet to 0 (a real graceful SIGTERM, and -- unlike deleting the pod --
      # it will not respawn), capturing the pod's logs AS IT TERMINATES (they vanish
      # once the pod is gone). Then assert the clean-stop line is present, the
      # SIGKILL-escalation line is ABSENT, and the source slot has no lingering
      # active consumer. Gating (hard fail), happy-path only.
      - name: Assert graceful controller shutdown (no SIGKILL, slot released)
        run: |
          set -euo pipefail
          mkdir -p migration-output
          POD="$(kubectl get pod -l pgcyan.dev/component=controller -n "$NS" \
            -o jsonpath='{.items[0].metadata.name}')"
          [ -n "$POD" ] || { echo "::error::no controller pod found to test shutdown"; exit 1; }
          echo "controller pod: $POD"

          # Follow the pod's logs in the background so the shutdown events emitted
          # DURING termination are captured before the pod (and its logs) disappear.
          kubectl logs -f "$POD" -n "$NS" --tail=-1 > migration-output/controller-shutdown.log 2>&1 &
          LOGPID=$!

          # Graceful stop: scale to 0 -> SIGTERM with the pod's full 60s grace, no respawn.
          kubectl scale statefulset pgcyan-controller -n "$NS" --replicas=0
          kubectl wait --for=delete "pod/$POD" -n "$NS" --timeout=90s \
            || { echo "::error::controller pod did not terminate within the grace window"; exit 1; }
          wait "$LOGPID" 2>/dev/null || true

          echo "----- controller shutdown log (tail) -----"
          tail -n 30 migration-output/controller-shutdown.log || true
          echo "------------------------------------------"

          # (1) clean-stop line present (park() caught the signal and stopped CDC).
          grep -q "stopped CDC and exiting park" migration-output/controller-shutdown.log \
            || grep -q "Received signal .*shutting down" migration-output/controller-shutdown.log \
            || { echo "::error::no clean-stop line in the controller shutdown logs (ungraceful?)"; exit 1; }

          # (2) the SIGKILL-escalation line MUST NOT appear (shared shutdown.py warning).
          if grep -q "pgcopydb did not exit in time; sending SIGKILL" migration-output/controller-shutdown.log; then
            echo "::error::controller SIGKILLed its pgcopydb child -- shutdown was not graceful"
            exit 1
          fi
          echo "graceful shutdown confirmed: clean stop, no SIGKILL"

          # (3) the source slot persists (for cutover) but has NO active consumer
          # now the controller is gone. CDC deactivation can lag a beat, so poll.
          kubectl delete job pgcyan-slot-release-check -n "$NS" --ignore-not-found --wait=true
          cat <<'EOF' | envsubst '${PGCYAN_IMAGE}' | kubectl apply -n "$NS" -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: pgcyan-slot-release-check
            labels: { pgcyan.dev/step: "controller-check" }
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 3600
            template:
              metadata:
                labels: { pgcyan.dev/step: "controller-check" }
              spec:
                serviceAccountName: pgcyan-worker
                restartPolicy: Never
                containers:
                  - name: check
                    image: "${PGCYAN_IMAGE}"
                    envFrom:
                      - secretRef: { name: pgcyan-db-uris }
                    command: ["sh", "-c"]
                    args:
                      - |
                        i=0; slots=0; active=1
                        while [ "$i" -lt 10 ]; do
                          slots=$(psql "$PGCOPYDB_SOURCE_PGURI" -tAc "SELECT count(*) FROM pg_replication_slots WHERE slot_type='logical'")
                          active=$(psql "$PGCOPYDB_SOURCE_PGURI" -tAc "SELECT count(*) FROM pg_replication_slots WHERE slot_type='logical' AND active")
                          if [ "${active:-1}" = "0" ]; then break; fi
                          i=$((i+1)); sleep 3
                        done
                        echo "SLOTRELEASE slots=${slots:-0} active=${active:-1}"
          EOF
          kubectl wait --for=condition=complete job/pgcyan-slot-release-check -n "$NS" --timeout=120s \
            || { kubectl logs job/pgcyan-slot-release-check -n "$NS" || true; echo "::error::slot-release check did not complete"; exit 1; }
          line="$(kubectl logs job/pgcyan-slot-release-check -n "$NS" --tail=-1 | grep -o 'SLOTRELEASE slots=[0-9]* active=[0-9]*' | tail -1)"
          echo "slot state after shutdown: [$line]"
          slots=$(echo "$line" | sed -E 's/.*slots=([0-9]+).*/\1/')
          active=$(echo "$line" | sed -E 's/.*active=([0-9]+).*/\1/')
          fail=0
          [ "${slots:-0}" -ge 1 ]  || { echo "::error::the logical slot should persist for cutover, got slots=${slots:-}"; fail=1; }
          [ "${active:-1}" -eq 0 ] || { echo "::error::slot still has an active consumer after teardown -- source connection not released, got active=${active:-}"; fail=1; }
          [ "$fail" -eq 0 ] || exit 1
          echo "slot released cleanly: $slots slot(s) persist, 0 active consumers"

      # Teardown: deleting the controller StatefulSet cascade-deletes every
      # workload it owns (planner/pre-data/data-shard Jobs, shard PVCs); then drop
      # the marker + plan + copy logs + collector so a re-run starts clean. The
      # snapshot child + CDC follow child died with the controller pod. A
      # StatefulSet's own volumeClaimTemplate PVC does NOT cascade -- delete it
      # explicitly so the next run gets a fresh --dir.
      - name: Teardown
        if: always()
        run: |
          kubectl delete statefulset pgcyan-controller -n "$NS" --ignore-not-found --wait=true --cascade=foreground || true
          kubectl delete pdb/pgcyan-controller svc/pgcyan-controller -n "$NS" --ignore-not-found || true
          kubectl delete configmap -n "$NS" --ignore-not-found \
            pgcyan-migration-state pgcyan-plan pgcyan-copylog || true
          kubectl delete configmap -n "$NS" --ignore-not-found -l pgcyan.dev/copylog=shard || true
          kubectl delete job pgcyan-collect-inputs pgcyan-target-check pgcyan-cdc-check pgcyan-cdc-roundtrip pgcyan-slot-release-check -n "$NS" --ignore-not-found --wait=false || true
          kubectl delete pvc -n "$NS" --ignore-not-found --wait=false -l pgcyan.dev/step=data || true
          # the controller's own --dir PVC (volumeClaimTemplate; not cascaded)
          kubectl delete pvc -n "$NS" --ignore-not-found --wait=false -l pgcyan.dev/component=controller || true

      - name: Upload controller logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgcyan-migration-${{ github.run_id }}
          path: migration-output/*
          if-no-files-found: warn
          retention-days: 30
