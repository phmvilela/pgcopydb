# 25-job-collect-inputs.yaml
# ---------------------------------------------------------------------------
# COLLECT STEP (control plane): the INPUT COLLECTOR.
#
# This is the only pre-plan step that TALKS TO THE SOURCE DATABASE. It runs the
# read-only pg_cyan collectors against the source Postgres and publishes their
# JSON artifacts into the `pgcyan-planner-inputs` ConfigMap that the planner
# (30-job-planner.yaml) consumes. The planner itself never opens a DB
# connection -- it is a pure offline transform over these files.
#
# It runs, in order:
#   * `pg_cyan.cli source-pg-metrics`     -> source-pg-metrics.json
#   * `pg_cyan.cli source-largeobjects`   -> source-pg-largeobjects.json
# then publishes both into the ConfigMap with kubectl (needs the orchestrator
# RBAC: configmaps create/patch). Each collector exits non-zero on failure and
# writes a *-errors.json instead, so a connection/query failure fails this Job
# and NOTHING is published -- the planner never sees a half-populated input set.
#
# It replaces the illustrative stub in 11-configmap-inputs.yaml with real data.
#
# DB auth: reads the single pgcopydb-style `PGCOPYDB_SOURCE_PGURI` from the
# shared `pgcyan-db-uris` Secret (the same Secret the controller/step pods use),
# created out-of-band (never in git):
#   kubectl create secret generic pgcyan-db-uris -n pgcyan-migration \
#     --from-literal=PGCOPYDB_SOURCE_PGURI="postgres://user:pw@host:5432/db?sslmode=require" \
#     --from-literal=PGCOPYDB_TARGET_PGURI="postgres://user:pw@host:5432/db?sslmode=require"
# The collectors are psycopg2-based and accept this URI via
# `pg_cyan.postgres.conn.source_conn_defaults` (URI preferred, else PG_SOURCE_*);
# the URI's `sslmode=require` is honoured (Azure Postgres requires TLS). Prefer
# Workload Identity / an Entra token over a static password once the CLI supports it.
# ---------------------------------------------------------------------------
apiVersion: batch/v1
kind: Job
metadata:
  name: pgcyan-collect-inputs
  namespace: pgcyan-migration
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400   # keep for a day for post-mortem, then GC
  template:
    metadata:
      labels:
        pgcyan.dev/step: "collect"
    spec:
      serviceAccountName: pgcyan-orchestrator   # needs configmap write RBAC
      restartPolicy: Never
      containers:
        - name: collector
          image: "${PGCYAN_IMAGE}"
          # Collect metrics + large-object count into a scratch dir, then publish
          # the two required planner inputs into the pgcyan-planner-inputs
          # ConfigMap. If either collector fails it exits non-zero here and the
          # && chain stops before anything is published.
          command: ["sh", "-c"]
          args:
            - >
              python -m pg_cyan.cli source-pg-metrics --output-dir=/work
              &&
              python -m pg_cyan.cli source-largeobjects --output-dir=/work
              &&
              kubectl create configmap pgcyan-planner-inputs
              --from-file=source-pg-metrics.json=/work/source-pg-metrics.json
              --from-file=source-pg-largeobjects.json=/work/source-pg-largeobjects.json
              --dry-run=client -o yaml | kubectl apply -f -
          envFrom:
            - secretRef:
                name: pgcyan-db-uris   # PGCOPYDB_SOURCE_PGURI (+ TARGET)
          volumeMounts:
            - name: work
              mountPath: /work
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "512Mi" }
      volumes:
        - name: work
          emptyDir: {}
