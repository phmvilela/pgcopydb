# 25-job-collect-inputs.yaml
# ---------------------------------------------------------------------------
# COLLECT STEP (control plane): the INPUT COLLECTOR.
#
# This is the only pre-plan step that TALKS TO THE SOURCE DATABASE. It runs the
# read-only pg_cyan collectors against the source Postgres and publishes their
# JSON artifacts into the `pgcyan-planner-inputs` ConfigMap that the planner
# (30-job-planner.yaml) consumes. The planner itself never opens a DB
# connection -- it is a pure offline transform over these files.
#
# It runs, in order:
#   * `pg_cyan.cli source-pg-metrics`     -> source-pg-metrics.json
#   * `pg_cyan.cli source-largeobjects`   -> source-pg-largeobjects.json
#   * `pg_cyan.cli capacity-inputs`       -> the capacity artifacts, IF an
#     operator-declared bundle is mounted (the optional pgcyan-capacity-declared
#     ConfigMap, written by POST /migrations #142); a no-op otherwise so the plan
#     falls back to static shards exactly as before.
#   * `pg_cyan.cli network-probe`         -> network.json (RTT + throughput),
#     measured over the source connection; overrides a declared network.json. An
#     optional collector: a probe failure exits 0 and keeps any declared value.
#   * `pg_cyan.cli source-capacity`       -> merges the source's catalog fields
#     (connections + WAL generation rate) into source-capacity.json, preserving
#     declared/cloud fields; also optional (a failure exits 0, keeps the artifact).
#   * `pg_cyan.cli source-capacity-azure` -> merges the source's Azure-cloud
#     fields (read-throughput ceiling + WAL disk free, #154) into
#     source-capacity.json; needs PGCYAN_SOURCE_AZURE_RESOURCE_ID and an Azure
#     Reader + Monitoring Reader grant on the source server (out of band, see
#     01-rbac.yaml); optional, missing config or API failure exits 0.
#   * `pg_cyan.cli target-capacity`       -> merges the TARGET's connection
#     headroom into target-capacity.json (connects via PGCOPYDB_TARGET_PGURI);
#     optional, merge-not-clobber.
#   * `pg_cyan.cli cluster-capacity`      -> aggregates node allocatable CPU + pod
#     capacity into cluster-capacity.json (lists nodes via the in-cluster API,
#     needs the pgcyan-node-reader ClusterRole); optional.
# then publishes them into the ConfigMap with kubectl (needs the orchestrator
# RBAC: configmaps create/patch). Each collector exits non-zero on failure and
# writes a *-errors.json instead, so a connection/query failure fails this Job
# and NOTHING is published -- the planner never sees a half-populated input set.
#
# It replaces the illustrative stub in 11-configmap-inputs.yaml with real data.
#
# DB auth: reads the single pgcopydb-style `PGCOPYDB_SOURCE_PGURI` from the
# shared `pgcyan-db-uris` Secret (the same Secret the controller/step pods use),
# created out-of-band (never in git):
#   kubectl create secret generic pgcyan-db-uris -n pgcyan-migration \
#     --from-literal=PGCOPYDB_SOURCE_PGURI="postgres://user:pw@host:5432/db?sslmode=require" \
#     --from-literal=PGCOPYDB_TARGET_PGURI="postgres://user:pw@host:5432/db?sslmode=require"
# The collectors are psycopg2-based and accept this URI via
# `pg_cyan.postgres.conn.source_conn_defaults` (URI preferred, else PG_SOURCE_*);
# the URI's `sslmode=require` is honoured (Azure Postgres requires TLS). Prefer
# Workload Identity / an Entra token over a static password once the CLI supports it.
# ---------------------------------------------------------------------------
apiVersion: batch/v1
kind: Job
metadata:
  name: pgcyan-collect-inputs
  namespace: pgcyan-migration
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400   # keep for a day for post-mortem, then GC
  template:
    metadata:
      labels:
        pgcyan.dev/step: "collect"
    spec:
      serviceAccountName: pgcyan-orchestrator   # needs configmap write RBAC
      restartPolicy: Never
      containers:
        - name: collector
          image: "${PGCYAN_IMAGE}"
          # Collect metrics + large-object count into a scratch dir, explode any
          # operator-declared capacity bundle into its planner artifacts, then
          # publish the required inputs plus whatever capacity artifacts were
          # produced into the pgcyan-planner-inputs ConfigMap. `set -e` makes any
          # collector failure abort before anything is published.
          command: ["sh", "-c"]
          args:
            - |
              set -e
              python -m pg_cyan.cli source-pg-metrics --output-dir=/work
              python -m pg_cyan.cli source-largeobjects --output-dir=/work
              # /declared is the optional pgcyan-capacity-declared ConfigMap (the
              # API / an operator writes it). Absent or empty -> capacity-inputs
              # is a no-op and no capacity artifacts are produced.
              python -m pg_cyan.cli capacity-inputs --inputs-dir=/declared --output-dir=/work
              # Measure the source path and (over)write network.json -- a measured
              # value overrides the declared one. Optional: a probe failure exits 0
              # and leaves any declared network.json in place, so the walk survives.
              python -m pg_cyan.cli network-probe --output-dir=/work
              # Merge the source's catalog fields (connections + WAL rate) into
              # source-capacity.json, preserving declared/cloud fields. Optional:
              # a failure exits 0 and keeps any existing source-capacity.json.
              python -m pg_cyan.cli source-capacity --output-dir=/work
              # Merge the source's Azure-cloud fields (read-throughput ceiling +
              # WAL disk free, #154) into source-capacity.json. Needs
              # PGCYAN_SOURCE_AZURE_RESOURCE_ID (env, not set here by default) and
              # an Azure Reader + Monitoring Reader grant on the source server.
              # Optional: missing config or an API failure exits 0 and keeps any
              # existing source-capacity.json.
              python -m pg_cyan.cli source-capacity-azure --output-dir=/work
              # Same for the TARGET's connection headroom (connects to the target
              # via PGCOPYDB_TARGET_PGURI). Optional, merge-not-clobber.
              python -m pg_cyan.cli target-capacity --output-dir=/work
              # Aggregate node allocatable CPU + pod capacity (lists nodes via the
              # in-cluster API; needs the pgcyan-node-reader ClusterRole). Optional.
              python -m pg_cyan.cli cluster-capacity --output-dir=/work
              set -- --from-file=source-pg-metrics.json=/work/source-pg-metrics.json \
                     --from-file=source-pg-largeobjects.json=/work/source-pg-largeobjects.json
              for a in source-capacity target-capacity network cluster-capacity constraints copylog-history; do
                if [ -f "/work/$a.json" ]; then set -- "$@" "--from-file=$a.json=/work/$a.json"; fi
              done
              kubectl create configmap pgcyan-planner-inputs "$@" \
                --dry-run=client -o yaml | kubectl apply -f -
          envFrom:
            - secretRef:
                name: pgcyan-db-uris   # PGCOPYDB_SOURCE_PGURI (+ TARGET)
          volumeMounts:
            - name: work
              mountPath: /work
            - name: declared
              mountPath: /declared
              readOnly: true
          resources:
            # A short-lived, read-only metadata collector that co-schedules with
            # the parked controller (it is the walk's first step), so keep the CPU
            # request small enough to fit alongside it on a constrained node.
            requests: { cpu: "50m", memory: "256Mi" }
            limits:   { cpu: "1",   memory: "512Mi" }
      volumes:
        - name: work
          emptyDir: {}
        # The operator-declared capacity bundle (capacity-declared.json), written
        # by POST /migrations (#142) or an operator. Optional: a run with no
        # declared capacity has no such ConfigMap, and the mount is simply empty.
        - name: declared
          configMap:
            name: pgcyan-capacity-declared
            optional: true
