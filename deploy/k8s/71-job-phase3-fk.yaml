# 71-job-phase3-fk.yaml
# ---------------------------------------------------------------------------
# FOREIGN-KEYS STEP: FOREIGN KEY constraints -- the SINGLE-PASS job.
#
# WHY it is one job and NOT sharded like the indexes:
#   A foreign key spans TWO tables that may live in DIFFERENT data shards. There
#   is no clean way to partition FK creation across shared-nothing pods without
#   them coordinating locks. So FKs are applied in ONE coordinated pass, after ALL
#   data (the copy step) AND all indexes (the indexes step) are in place.
#
# WHY CUSTOM SQL, NOT pgcopydb: the wrapper (`build-foreign-keys`,
# PgCyanForeignKeys) introspects the source's FK definitions and applies each to
# the target as `ADD CONSTRAINT ... NOT VALID` (brief lock) then `VALIDATE
# CONSTRAINT` (scans under a weak lock). `pgcopydb restore constraints` validates
# FKs inline and cannot produce that split -- and the split is the whole point:
# FK validation is the slow, un-parallelizable tail of a restore, so keeping the
# exclusive-lock window tiny matters for a minimal-downtime cutover.
#
# WHY MORE KUBERNETES POWER HERE IS A CATEGORY ERROR: FK validation -- the scan
# proving existing rows satisfy the constraint -- runs ON THE TARGET SERVER.
# Fattening THIS pod does not speed it up; scale the TARGET, not the pod. This pod
# is thin, talks only to Postgres (psycopg2, no pgcopydb, no --dir), and writes
# the authoritative target-pg-postload-log.json.
#
# This is the last hard barrier before the source and target are schema- and
# data-equivalent (modulo any CDC still catching up in the follow step).
# See also: pg_cyan/postfk.py
apiVersion: batch/v1
kind: Job
metadata:
  name: pgcyan-phase3-fk
  namespace: pgcyan-migration
  labels:
    pgcyan.dev/step: "foreign-keys"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        pgcyan.dev/step: "foreign-keys"
    spec:
      serviceAccountName: pgcyan-worker
      # Non-root uid 1000 ('migration'). No managed-disk PVC here -- this step is
      # pure psycopg2 (no pgcopydb catalog), so it only needs a scratch dir for
      # the one small output JSON; an emptyDir suffices, so no fsGroup is needed.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      restartPolicy: Never
      containers:
        - name: pgcyan-fk
          image: "${PGCYAN_IMAGE}"
          # The pg_cyan `build-foreign-keys` wrapper (PgCyanForeignKeys):
          # introspect the source's FKs, apply each to the target NOT VALID then
          # VALIDATE CONSTRAINT, and write target-pg-postload-log.json. Idempotent.
          command: ["python", "-m", "pg_cyan.cli", "build-foreign-keys"]
          envFrom:
            - secretRef:
                name: pgcyan-db-uris     # PGCOPYDB_SOURCE_PGURI / _TARGET_PGURI
          env:
            - name: PG_OUTPUT_DIR
              value: "/work"
          volumeMounts:
            - name: workdir
              mountPath: /work
          resources:
            # THIN ON PURPOSE -- validation happens on the target server.
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
      volumes:
        # Scratch for the output JSON only (no pgcopydb catalog to persist).
        - name: workdir
          emptyDir: {}
