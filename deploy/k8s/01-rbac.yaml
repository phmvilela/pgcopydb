# 01-rbac.yaml
# ---------------------------------------------------------------------------
# Three identities:
#
#   1. pgcyan-orchestrator -- the control plane. It (and only it) is allowed to
#      create/patch/delete the per-phase Jobs and to read their status so it can
#      enforce the DAG barriers (wait for phase N to fully succeed before
#      applying phase N+1). This is the imperative glue that plain YAML cannot
#      express on its own.
#
#   2. pgcyan-worker -- the data-plane identity used by every pgcopydb Job/pod
#      (pre-data, snapshot holder, data shards, index/FK, CDC). Workers need NO
#      Kubernetes API access at all -- they only talk to Postgres. They get a
#      near-empty ServiceAccount purely so we can bind Azure Workload Identity
#      (federated) credentials to it instead of shipping static DB passwords.
#
#   3. pgcyan-viewer -- a read-only *observer* identity. It runs no workload; it
#      exists so an out-of-cluster operator can watch the migration -- pods, logs,
#      jobs, the plan/snapshot ConfigMaps. It does so *without* cluster-admin reach
#
# ASSUMPTION: cluster is AKS with OIDC + Workload Identity enabled, so DB auth
# can be Entra-token based. If that is not available, fall back to the Secret in
# 10-secrets.example.yaml. Per pgcyan CLAUDE.md we prefer managed identity /
# DefaultAzureCredential over static credentials.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pgcyan-orchestrator
  namespace: pgcyan-migration
  # TODO: annotate with the Workload Identity client id once the planner app's
  # federated credential exists:
  #   azure.workload.identity/client-id: "<orchestrator-mi-client-id>"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pgcyan-worker
  namespace: pgcyan-migration
  labels:
    azure.workload.identity/use: "true"
  # TODO: annotate with the Workload Identity client id of the managed identity
  # that has been granted login on BOTH source and target Postgres:
  #   azure.workload.identity/client-id: "<worker-mi-client-id>"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pgcyan-orchestrator
  namespace: pgcyan-migration
rules:
  # Create and supervise the phase Jobs and the snapshot-holder Deployment.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  # PodDisruptionBudgets ship alongside the snapshot-holder/follow-cdc
  # Deployments (50/80) -- the orchestrator applies whatever a phase manifest
  # contains, which includes these.
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  # Read pod status/logs to detect shard failures and surface progress.
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  # Publish the generated plan + the snapshot id, and read the collected inputs.
  # (The snapshot holder runs as this SA and publishes the pgcyan-snapshot
  # ConfigMap; the planner Job publishes pgcyan-plan -- see issue #58 / #38.)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "watch", "patch", "update"]
  # Stamp one ReadWriteOnce work-dir PVC per data/index shard so pgcopydb's
  # SQLite/WAL catalog runs on a local managed disk, not Azure Files (issue #58).
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pgcyan-orchestrator
  namespace: pgcyan-migration
subjects:
  - kind: ServiceAccount
    name: pgcyan-orchestrator
    namespace: pgcyan-migration
roleRef:
  kind: Role
  name: pgcyan-orchestrator
  apiGroup: rbac.authorization.k8s.io
---
# --- pgcyan-viewer: read-only observer (see header, identity 3) --------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pgcyan-viewer
  namespace: pgcyan-migration
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pgcyan-viewer
  namespace: pgcyan-migration
rules:
  # Observe the migration DAG: pods (+ their logs), the jobs and the
  # snapshot-holder / follow-cdc Deployments and the ReplicaSets they own.
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  # Read the plan / snapshot / inputs ConfigMaps and the work-dir PVCs the
  # phases stamp, plus the events that explain scheduling / image-pull failures.
  - apiGroups: [""]
    resources: ["configmaps", "persistentvolumeclaims", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  # NOTE (deliberate exclusions, least privilege):
  #   * NO "secrets"          -- the viewer must never read pgcyan-db-uris etc.
  #   * NO "pods/exec", "pods/portforward" -- observe only, no shell into pods.
  #   * NO create/patch/update/delete anywhere -- read-only.
  # To grant exec/port-forward for live debugging, add a rule:
  #   - apiGroups: [""]
  #     resources: ["pods/exec", "pods/portforward"]
  #     verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pgcyan-viewer
  namespace: pgcyan-migration
subjects:
  - kind: ServiceAccount
    name: pgcyan-viewer
    namespace: pgcyan-migration
roleRef:
  kind: Role
  name: pgcyan-viewer
  apiGroup: rbac.authorization.k8s.io
