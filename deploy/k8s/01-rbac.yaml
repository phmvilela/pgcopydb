# Three identities:
#
#   1. pgcyan-orchestrator -- the control plane. It (and only it) creates/patches/
#      deletes the per-step Jobs and reads their status to enforce the DAG
#      barriers (wait for step N to fully succeed before applying N+1). This is
#      the imperative glue that plain YAML cannot express on its own.
#      See also: pg_cyan/controller.py, pg_cyan/orchestrator.py
#
#   2. pgcyan-worker -- the data-plane identity used by every pgcopydb Job/pod.
#      Workers mostly just talk to Postgres, and get a ServiceAccount primarily so
#      Azure Workload Identity (federated) credentials can bind to it instead of
#      shipping static DB passwords. The ONE Kubernetes API grant they need is a
#      narrow configmaps create/get/patch: a data shard writes its per-table copy
#      log to a pgcyan-copylog-<shard> ConfigMap (its work dir is a private RWO
#      disk the orchestrator cannot mount, so the ConfigMap is the durable handoff
#      the orchestrator reads to aggregate migration-copy-log.json). Nothing else.
#
#   3. pgcyan-viewer -- a read-only observer identity. It runs no workload; it
#      exists so an out-of-cluster operator can watch the migration -- pods, logs,
#      jobs, the plan ConfigMaps -- without cluster-admin reach.
#
# ASSUMPTION: cluster is AKS with OIDC + Workload Identity enabled, so DB auth
# can be Entra-token based. If that is not available, fall back to the Secret in
# 10-secrets.example.yaml. We prefer managed identity / DefaultAzureCredential
# over static credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pgcyan-orchestrator
  namespace: pgcyan-migration
  # TODO: annotate with the Workload Identity client id once the planner app's
  # federated credential exists:
  #   azure.workload.identity/client-id: "<orchestrator-mi-client-id>"
  #
  # The `source-capacity-azure` collector (#154, runs as this SA in the collect
  # Job, 25-job-collect-inputs.yaml) reads the source server's storage/SKU and
  # its `storage_used` Monitor metric. This is AZURE IAM, not Kubernetes RBAC --
  # grant the managed identity behind this SA's Workload Identity federation
  # `Reader` (servers.get) and `Monitoring Reader` (the metric) roles SCOPED TO
  # THE SOURCE SERVER RESOURCE, out of band, e.g.:
  #   az role assignment create --assignee <orchestrator-mi-client-id> \
  #     --role Reader --scope <source-server-resource-id>
  #   az role assignment create --assignee <orchestrator-mi-client-id> \
  #     --role "Monitoring Reader" --scope <source-server-resource-id>
  # The collector is optional and degrades per-field if either grant is
  # missing -- see pg_cyan/collect/sourcecap_azure.py.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pgcyan-worker
  namespace: pgcyan-migration
  labels:
    azure.workload.identity/use: "true"
  # TODO: annotate with the Workload Identity client id of the managed identity
  # that has been granted login on BOTH source and target Postgres:
  #   azure.workload.identity/client-id: "<worker-mi-client-id>"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pgcyan-orchestrator
  namespace: pgcyan-migration
rules:
  # Create and supervise the step Jobs and the follow-CDC Deployment. The
  # `*/status` subresources are SEPARATE from the parent in RBAC: the orchestrator
  # polls each step's barrier via read_namespaced_job_status /
  # read_namespaced_deployment_status (the `jobs/status` / `deployments/status`
  # subresources), which a grant on `jobs`/`deployments` alone does NOT cover --
  # without them the barrier read is Forbidden even though create/get succeed.
  - apiGroups: ["batch"]
    resources: ["jobs", "jobs/status"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/status"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  # PodDisruptionBudgets ship with the controller StatefulSet, and the
  # orchestrator applies whatever a step manifest contains, so it keeps the
  # verbs for any future Deployment/PDB step too.
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  # Read pod status/logs to detect shard failures and surface progress.
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  # Publish the generated plan + the aggregated copy log, and read the collected
  # inputs. (The controller holds the snapshot in-pod and injects SNAPSHOT_ID
  # directly -- no pgcyan-snapshot ConfigMap; the planner Job publishes
  # pgcyan-plan.)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "watch", "patch", "update"]
  # Stamp one ReadWriteOnce work-dir PVC per data/index shard so pgcopydb's
  # SQLite/WAL catalog runs on a local managed disk, not Azure Files.
  # See also: deploy/k8s/20-pvc-workdir.yaml
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pgcyan-orchestrator
  namespace: pgcyan-migration
subjects:
  - kind: ServiceAccount
    name: pgcyan-orchestrator
    namespace: pgcyan-migration
roleRef:
  kind: Role
  name: pgcyan-orchestrator
  apiGroup: rbac.authorization.k8s.io
---
# --- pgcyan-node-reader: read-only, cluster-scoped node listing ----------------
# The collect step's `cluster-capacity` collector aggregates node allocatable CPU
# + pod capacity into cluster-capacity.json. Nodes are cluster-scoped, so this is
# a ClusterRole (not a namespaced Role). It grants ONLY get/list/watch on nodes --
# no writes, no other resources. The collector is optional and degrades if this is
# absent, so a cluster that withholds it just falls back (no k8s_cpu term).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pgcyan-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pgcyan-node-reader
subjects:
  - kind: ServiceAccount
    name: pgcyan-orchestrator
    namespace: pgcyan-migration
roleRef:
  kind: ClusterRole
  name: pgcyan-node-reader
  apiGroup: rbac.authorization.k8s.io
---
# --- pgcyan-worker: one narrow grant so a data shard can publish its copy log --
# The data shards write their per-table copy log to a pgcyan-copylog-<shard>
# ConfigMap, which the orchestrator reads to build the combined
# migration-copy-log.json. That is the ONLY Kubernetes API a worker touches --
# no jobs, pods, secrets, or deployments. (`create` cannot be scoped to a name in
# RBAC, so it is namespace-wide for configmaps; get/patch keep a resumed shard's
# re-publish idempotent.)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pgcyan-worker
  namespace: pgcyan-migration
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pgcyan-worker
  namespace: pgcyan-migration
subjects:
  - kind: ServiceAccount
    name: pgcyan-worker
    namespace: pgcyan-migration
roleRef:
  kind: Role
  name: pgcyan-worker
  apiGroup: rbac.authorization.k8s.io
---
# --- pgcyan-viewer: read-only observer (see header, identity 3) --------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pgcyan-viewer
  namespace: pgcyan-migration
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pgcyan-viewer
  namespace: pgcyan-migration
rules:
  # Observe the migration DAG: pods (+ their logs), the step Jobs and the
  # controller StatefulSet (which holds the snapshot in-pod and streams CDC).
  # Deployment/ReplicaSet verbs are kept for any future Deployment step.
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  # Read the plan / snapshot / inputs ConfigMaps and the work-dir PVCs the
  # steps stamp, plus the events that explain scheduling / image-pull failures.
  - apiGroups: [""]
    resources: ["configmaps", "persistentvolumeclaims", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  # NOTE (deliberate exclusions, least privilege):
  #   * NO "secrets"          -- the viewer must never read pgcyan-db-uris etc.
  #   * NO "pods/exec", "pods/portforward" -- observe only, no shell into pods.
  #   * NO create/patch/update/delete anywhere -- read-only.
  # To grant exec/port-forward for live debugging, add a rule:
  #   - apiGroups: [""]
  #     resources: ["pods/exec", "pods/portforward"]
  #     verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pgcyan-viewer
  namespace: pgcyan-migration
subjects:
  - kind: ServiceAccount
    name: pgcyan-viewer
    namespace: pgcyan-migration
roleRef:
  kind: Role
  name: pgcyan-viewer
  apiGroup: rbac.authorization.k8s.io
