# kustomization.yaml
# ---------------------------------------------------------------------------
# Bundles every directly-appliable (non-template) deploy/k8s manifest so the
# pgcyan image reference can be pinned to a freshly-published digest in one
# place instead of hand-editing eight files (issue #40 follow-up: CI deploy,
# see .github/workflows/publish-image.yml's `deploy` job).
#
# EXCLUDES:
#   * 10-secrets.example.yaml -- an EXAMPLE; never apply placeholder secret
#     values to a real cluster. Create the real Secret out-of-band.
#   * 11-configmap-inputs.yaml / 12-configmap-plan.yaml -- illustrative stubs
#     that the phase -2 collector / planner Jobs overwrite with real content;
#     applying the stub adds nothing.
#   * 60-job-phase2-datashard.template.yaml / 70-job-phase3-index.template.yaml
#     -- NOT standalone-appliable (contain ${SHARD_NAME}/etc. placeholders the
#     orchestrator substitutes once per plan.json entry -- see
#     pg_cyan/orchestrator.py). The orchestrator applies these directly from
#     this same directory with the image reference AS AUTHORED IN THE FILE,
#     unaffected by this kustomization's `images:` override below -- see the
#     "self-referencing image digest" gap noted in
#     notes/k8s-sharded-migration-topology.md.
#
# Usage:
#   kubectl kustomize deploy/k8s          # preview the rendered, pinned bundle
#   kubectl apply -k deploy/k8s           # apply the whole bundle yourself
#
# CI's `deploy` job (manual, workflow_dispatch only) rewrites the `images:`
# digest below to whatever it just published, renders the full bundle as a
# build artifact for reference, but APPLIES only the 00/01/20 subset
# (namespace/RBAC/PVC) -- starting the phase -2/-1/... Jobs is a deliberate,
# separate human action (see the workflow file for the rationale).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 00-namespace.yaml
  - 01-rbac.yaml
  - 20-pvc-workdir.yaml
  - 25-job-collect-inputs.yaml
  - 30-job-planner.yaml
  - 40-job-phase0-predata.yaml
  - 50-deployment-snapshot-holder.yaml
  - 71-job-phase3-fk.yaml
  - 80-deployment-follow-cdc.yaml

# Placeholder digest -- CI's `deploy` job overwrites this line with the digest
# it just published before rendering (see the workflow's "Pin the published
# digest" step). Left at the issue-#39 build's digest so `kubectl kustomize`
# still produces valid, pinned output when run locally without CI.
images:
  - name: pgcyanacr.azurecr.io/pgcyan
    digest: sha256:a348ba7ddb6eedf0658f4b9bee9312eee128085f9de7896da8a0b89835b2940a
