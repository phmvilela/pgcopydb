# kustomization.yaml
# ---------------------------------------------------------------------------
# Bundles every directly-appliable (non-template) deploy/k8s manifest so the
# whole set can be previewed/applied at once.
#
# The pgcyan image is NOT pinned here. Every manifest carries an
# `image: "${PGCYAN_IMAGE}"` placeholder that is filled at apply time:
#   * the integration-tests workflow substitutes the commit-short-SHA-tagged
#     ACR image via `envsubst` before `kubectl apply`, and
#   * the orchestrator (pg_cyan/orchestrator.py) substitutes its OWN running
#     image so every phase Job/Deployment it launches matches its tag.
# `kubectl kustomize deploy/k8s` therefore emits the literal `${PGCYAN_IMAGE}`
# placeholder -- fill it (envsubst) before applying the rendered output.
#
# EXCLUDES:
#   * 10-secrets.example.yaml -- an EXAMPLE; never apply placeholder secret
#     values to a real cluster. Create the real Secret out-of-band.
#   * 11-configmap-inputs.yaml / 12-configmap-plan.yaml -- illustrative stubs
#     that the phase -2 collector / planner Jobs overwrite with real content;
#     applying the stub adds nothing.
#   * 60-job-phase2-datashard.template.yaml / 70-job-phase3-index.template.yaml
#     -- NOT standalone-appliable (contain ${SHARD_NAME}/etc. placeholders the
#     orchestrator substitutes once per plan.json entry -- see
#     pg_cyan/orchestrator.py).
#
# Usage:
#   kubectl kustomize deploy/k8s          # preview (placeholder image)
#   PGCYAN_IMAGE=<reg>/pgcyan:<short-sha> \
#     kubectl kustomize deploy/k8s | envsubst '${PGCYAN_IMAGE}' | kubectl apply -f -
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 00-namespace.yaml
  - 01-rbac.yaml
  - 20-pvc-workdir.yaml
  - 25-job-collect-inputs.yaml
  - 30-job-planner.yaml
  # The migration controller: folded snapshot-holder + DAG orchestrator, run as
  # a single-pod StatefulSet.
  - 35-statefulset-controller.yaml
  - 40-job-phase0-predata.yaml
  - 62-job-sequences.yaml
  - 71-job-phase3-fk.yaml
  # (No follow-CDC Deployment: the controller streams CDC itself.)
