# 60-job-phase2-datashard.template.yaml
# ---------------------------------------------------------------------------
# PHASE 2: DATA SHARDS -- the horizontally-scaled COPY workers. This is a
# TEMPLATE. The orchestrator stamps out ONE Job per entry in
# plan.json > data_shards, substituting the ${...} placeholders. They all run
# concurrently, all point at the same source+target, and by construction (their
# filter files are disjoint) they never touch the same table.
#
# WHERE THE WORK LIVES: COPY streams source -> pod -> target. The pod is mostly
# an I/O pipe; its bottleneck is NETWORK bandwidth, not CPU. That is exactly why
# fanning out into many pods helps here (more aggregate egress/ingress) -- and
# is the OPPOSITE of phase 3, whose work runs on the target server (see 70/71).
#
# NO-OVERLAP GUARANTEE: `--filters /plan/${FILTER_FILE}` restricts this shard to
# an explicit [include-only-table] list authored by the planner. Two shards with
# disjoint lists cannot collide. This is the physical enforcement of "the
# planner makes sure nothing overlaps".
#
# CONSISTENCY: `--snapshot ${SNAPSHOT_ID}` ties this shard to the holder's
# snapshot (phase 1) so all shards copy the same instant.
#
# INTRA-TABLE SPLIT: `--split-tables-larger-than` lets a single shard further
# parallelise a giant table across `--table-jobs` processes via integer-range or
# CTID split. For a table too big for even one shard, the planner instead emits
# multiple shards each pinned to a different key range (TODO: needs a per-range
# filter mechanism; today pgcopydb splits WITHIN a job, so range-across-jobs is
# a planner responsibility -- see note).
#
# RESUME: `--dir=/work` on this shard's OWN ReadWriteOnce managed disk
# (pgcyan-workdir-${SHARD_NAME}, stamped from the PVC document below) + `--resume`.
# A killed shard pod restarts, re-attaches the same disk, and continues at
# per-table / per-part granularity, never redoing a completed table --
# backoffLimit lets k8s do that restart automatically. The disk is RWO (one pod
# at a time) and local ext4, so pgcopydb's SQLite/WAL catalog gets the file
# locking Azure Files (SMB) cannot provide (issue #58).
#
# SNAPSHOT: `--snapshot="${SNAPSHOT_ID}"` where SNAPSHOT_ID comes from the
# `pgcyan-snapshot` ConfigMap the holder publishes (phase 1) -- no shared volume,
# no initContainer. All shards read the same key, so they copy the same instant.
# ---------------------------------------------------------------------------
# The per-shard work disk. The orchestrator stamps one of these per
# plan.json > data_shards entry (same ${SHARD_NAME} substitution as the Job).
# ReadWriteOnce: exactly one shard pod uses it at a time. See 20-pvc-workdir.yaml
# for the full rationale (issue #58).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgcyan-workdir-${SHARD_NAME}
  namespace: pgcyan-migration
  labels:
    pgcyan.dev/phase: "data"
    pgcyan.dev/shard: "${SHARD_NAME}"
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
  storageClassName: managed-csi   # TODO: confirm the RWO class name on the target cluster
---
apiVersion: batch/v1
kind: Job
metadata:
  # TODO(orchestrator): substitute ${SHARD_NAME}, e.g. pgcyan-datashard-shard-0
  name: pgcyan-datashard-${SHARD_NAME}
  namespace: pgcyan-migration
  labels:
    pgcyan.dev/phase: "data"
    pgcyan.dev/shard: "${SHARD_NAME}"
spec:
  backoffLimit: 6                 # shards are resumable; let k8s retry generously
  completions: 1
  parallelism: 1                  # ONE pod per shard; scale-out is MORE SHARDS, not more pods here
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        pgcyan.dev/phase: "data"
        pgcyan.dev/shard: "${SHARD_NAME}"
    spec:
      serviceAccountName: pgcyan-worker
      restartPolicy: Never
      containers:
        - name: pgcopydb-copy
          image: "${PGCYAN_IMAGE}"
          # `clone --skip-extensions --no-acl ...` limited to this shard's tables.
          # Using `copy-db`/`clone` restricted to the include-only filter set.
          command: ["sh", "-c"]
          args:
            - >
              pgcopydb clone
              --dir=/work
              --filters=/plan/${FILTER_FILE}
              --snapshot="$(SNAPSHOT_ID)"
              --table-jobs=${TABLE_JOBS}
              --index-jobs=0
              --split-tables-larger-than=${SPLIT_TABLES_LARGER_THAN}
              --skip-vacuum
              --no-owner
              --resume
              --restart=false
          # NOTE: --index-jobs=0 and --skip-vacuum: phase 2 loads HEAP ONLY.
          # Index builds, constraints and vacuum are deferred to phase 3 so the
          # COPY is not slowed by index maintenance. This is the whole point of
          # the pre-data / post-data split.
          envFrom:
            - secretRef:
                name: pgcyan-db-uris
          # TODO(orchestrator): substitute these from plan.json > data_shards[i].
          env:
            # The exported snapshot id, published by the phase-1 holder into the
            # pgcyan-snapshot ConfigMap. Every shard reads the same key, so they
            # all pin the same consistent instant (issue #58 -- replaces the old
            # shared-volume file + initContainer handoff).
            - name: SNAPSHOT_ID
              valueFrom:
                configMapKeyRef:
                  name: pgcyan-snapshot
                  key: snapshot
            - name: FILTER_FILE
              value: "${FILTER_FILE}"            # e.g. shard-0.filters
            - name: TABLE_JOBS
              value: "${TABLE_JOBS}"             # e.g. 4  (intra-shard COPY processes)
            - name: SPLIT_TABLES_LARGER_THAN
              value: "${SPLIT_TABLES_LARGER_THAN}"  # e.g. 50GB
          volumeMounts:
            - name: workdir
              mountPath: /work
            - name: plan
              mountPath: /plan
              readOnly: true
          resources:
            # Network-bound; sized per-shard by the planner from assigned bytes.
            # TODO(orchestrator): substitute from plan.json > data_shards[i].resources
            requests: { cpu: "${CPU_REQUEST}", memory: "${MEM_REQUEST}" }
            limits:   { cpu: "${CPU_LIMIT}",   memory: "${MEM_LIMIT}" }
      volumes:
        - name: workdir
          persistentVolumeClaim:
            claimName: pgcyan-workdir-${SHARD_NAME}
        - name: plan
          configMap:
            name: pgcyan-plan
