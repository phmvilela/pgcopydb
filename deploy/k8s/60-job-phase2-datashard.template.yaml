# 60-job-phase2-datashard.template.yaml
# ---------------------------------------------------------------------------
# PHASE 2: DATA SHARDS -- the horizontally-scaled COPY workers. This is a
# TEMPLATE. The orchestrator stamps out ONE Job per entry in
# plan.json > data_shards, substituting the ${...} placeholders. They all run
# concurrently, all point at the same source+target, and by construction (their
# filter files are disjoint) they never touch the same table.
#
# WHERE THE WORK LIVES: COPY streams source -> pod -> target. The pod is mostly
# an I/O pipe; its bottleneck is NETWORK bandwidth, not CPU. That is exactly why
# fanning out into many pods helps here (more aggregate egress/ingress) -- and
# is the OPPOSITE of phase 3, whose work runs on the target server (see 70/71).
#
# NO-OVERLAP GUARANTEE: `--filters /plan/${FILTER_FILE}` restricts this shard to
# an explicit [include-only-table] list authored by the planner. Two shards with
# disjoint lists cannot collide. This is the physical enforcement of "the
# planner makes sure nothing overlaps".
#
# CONSISTENCY: `--snapshot ${SNAPSHOT_ID}` ties this shard to the holder's
# snapshot (phase 1) so all shards copy the same instant.
#
# DATA ONLY: the pod runs `pg_cyan.cli copy-shard`, which drives `pgcopydb copy
# table-data` -- NOT `pgcopydb clone`. Phase 0 (#24) already restored the schema
# and phase 3 (#28) builds the indexes/constraints, so this phase copies the HEAP
# and nothing else. `clone` would re-run both schema sections and collide with
# phases 0/3 (see notes/migration-phases-lessons-learned.md item 6).
#
# INTRA-TABLE SPLIT: `--split-tables-larger-than` lets a single shard further
# parallelise a giant table across `--table-jobs` processes via integer-range or
# CTID split. For a table too big for even one shard, the planner instead emits
# multiple shards each pinned to a different key range (TODO: needs a per-range
# filter mechanism; today pgcopydb splits WITHIN a job, so range-across-jobs is
# a planner responsibility -- see note).
#
# RESUME: `--dir=/work` on this shard's OWN ReadWriteOnce managed disk
# (pgcyan-workdir-${SHARD_NAME}, stamped from the PVC document below) + `--resume
# --restart=false`. A killed shard pod restarts, re-attaches the same disk, and
# continues at per-table / per-part granularity, never redoing a completed table
# -- backoffLimit lets k8s do that restart automatically. The disk is RWO (one
# pod at a time) and local ext4, so pgcopydb's SQLite/WAL catalog gets the file
# locking Azure Files (SMB) cannot provide (issue #58).
#
# SNAPSHOT: `--snapshot="${SNAPSHOT_ID}"` where SNAPSHOT_ID comes from the
# `pgcyan-snapshot` ConfigMap the holder publishes (phase 1) -- no shared volume,
# no initContainer. All shards read the same key, so they copy the same instant.
# (SEAM: issue #70 folds the holder into the orchestrator and injects SNAPSHOT_ID
# directly into this env instead of via the ConfigMap -- this configMapKeyRef
# goes away then.)
#
# OUTPUT: the wrapper writes migration-copy-log.json (slot/publication/snapshot +
# per-table row counts landed on the target) to /work AND publishes it to a
# per-shard `pgcyan-copylog-${SHARD_NAME}` ConfigMap. The orchestrator (#40) lists
# those by label and merges them into the combined migration-copy-log.json. The
# work dir is a private RWO disk the orchestrator cannot mount, so the ConfigMap
# is the durable handoff -- the shard's SA has a narrow configmaps grant for it
# (01-rbac.yaml).
# ---------------------------------------------------------------------------
# The per-shard work disk. The orchestrator stamps one of these per
# plan.json > data_shards entry (same ${SHARD_NAME} substitution as the Job).
# ReadWriteOnce: exactly one shard pod uses it at a time. See 20-pvc-workdir.yaml
# for the full rationale (issue #58).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgcyan-workdir-${SHARD_NAME}
  namespace: pgcyan-migration
  labels:
    pgcyan.dev/phase: "data"
    pgcyan.dev/shard: "${SHARD_NAME}"
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
  storageClassName: managed-csi   # TODO: confirm the RWO class name on the target cluster
---
apiVersion: batch/v1
kind: Job
metadata:
  # TODO(orchestrator): substitute ${SHARD_NAME}, e.g. pgcyan-datashard-shard-0
  name: pgcyan-datashard-${SHARD_NAME}
  namespace: pgcyan-migration
  labels:
    pgcyan.dev/phase: "data"
    pgcyan.dev/shard: "${SHARD_NAME}"
spec:
  backoffLimit: 6                 # shards are resumable; let k8s retry generously
  completions: 1
  parallelism: 1                  # ONE pod per shard; scale-out is MORE SHARDS, not more pods here
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        pgcyan.dev/phase: "data"
        pgcyan.dev/shard: "${SHARD_NAME}"
    spec:
      serviceAccountName: pgcyan-worker
      # The image runs as non-root uid 1000 ('migration', Dockerfile: useradd
      # -u 1000). A freshly-provisioned Azure managed disk mounts root:root 0755,
      # which uid 1000 cannot write (pgcopydb: "Failed to create directory
      # /work/schema: Permission denied"). fsGroup group-owns the work disk to
      # gid 1000 so the process can write; OnRootMismatch skips re-chowning the
      # catalog on every resume/restart.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000       # 'migration' from the image
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never
      containers:
        - name: pgcopydb-copy
          image: "${PGCYAN_IMAGE}"
          # The pg_cyan `copy-shard` wrapper (PgCyanDataShard, issue #25) drives
          # `pgcopydb copy table-data` -- DATA ONLY, restricted to this shard's
          # [include-only-table] filter set and pinned to the holder's snapshot --
          # then counts the rows landed on the target, writes
          # migration-copy-log.json to /work, and publishes it to the per-shard
          # `pgcyan-copylog-${SHARD_NAME}` ConfigMap for the orchestrator to
          # aggregate across shards.
          #
          # DATA ONLY on purpose: phase 0 (pre-data) created the schema and phase
          # 3 (post-data) builds indexes/constraints -- so `copy table-data`
          # copies the HEAP and nothing else. `pgcopydb clone` would re-run both
          # schema sections and collide with phases 0/3 (re-tripping the Azure
          # extension/ownership walls). --skip-vacuum + no index build fall out of
          # `copy table-data`; the wrapper adds --resume --restart=false so a
          # backed-off pod continues on its RWO disk. See
          # notes/migration-phases-lessons-learned.md items 2 and 6.
          command: ["python", "-m", "pg_cyan.cli", "copy-shard"]
          envFrom:
            - secretRef:
                name: pgcyan-db-uris
          # TODO(orchestrator): substitute these from plan.json (top-level
          # slot/publication) and plan.json > data_shards[i].
          env:
            # The exported snapshot id, published by the phase-1 holder into the
            # pgcyan-snapshot ConfigMap. Every shard reads the same key, so they
            # all pin the same consistent instant (issue #58 -- replaces the old
            # shared-volume file + initContainer handoff).
            - name: SNAPSHOT_ID
              valueFrom:
                configMapKeyRef:
                  name: pgcyan-snapshot
                  key: snapshot
            - name: SHARD_NAME
              value: "${SHARD_NAME}"             # e.g. shard-0 (recorded in the log)
            - name: FILTER_FILE
              value: "${FILTER_FILE}"            # e.g. shard-0.filters
            - name: SLOT_NAME
              value: "${SLOT_NAME}"              # from plan.json > slot.name (for the log)
            - name: PUBLICATION_NAME
              value: "${PUBLICATION_NAME}"       # from plan.json > publication.name (for the log)
            - name: TABLE_JOBS
              value: "${TABLE_JOBS}"             # e.g. 4  (intra-shard COPY processes)
            - name: SPLIT_TABLES_LARGER_THAN
              value: "${SPLIT_TABLES_LARGER_THAN}"  # e.g. 50GB
            # Filter files are mounted at /plan; the copy log lands next to the
            # pgcopydb catalog on this shard's own RWO work disk.
            - name: PGCYAN_PLAN_DIR
              value: "/plan"
            - name: PG_OUTPUT_DIR
              value: "/work"
            # The shard publishes its copy log to pgcyan-copylog-${SHARD_NAME}
            # (derived from SHARD_NAME by the wrapper) in THIS pod's namespace, so
            # the orchestrator can read it. The narrow configmaps grant is on the
            # pgcyan-worker SA (01-rbac.yaml).
            - name: PGCYAN_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: workdir
              mountPath: /work
            - name: plan
              mountPath: /plan
              readOnly: true
          resources:
            # Network-bound; sized per-shard by the planner from assigned bytes.
            # TODO(orchestrator): substitute from plan.json > data_shards[i].resources
            requests: { cpu: "${CPU_REQUEST}", memory: "${MEM_REQUEST}" }
            limits:   { cpu: "${CPU_LIMIT}",   memory: "${MEM_LIMIT}" }
      volumes:
        - name: workdir
          persistentVolumeClaim:
            claimName: pgcyan-workdir-${SHARD_NAME}
        - name: plan
          configMap:
            name: pgcyan-plan
