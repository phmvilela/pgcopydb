# 10-secrets.example.yaml
# ---------------------------------------------------------------------------
# EXAMPLE ONLY -- DO NOT COMMIT A REAL VERSION OF THIS FILE.
# Per pgcyan CLAUDE.md: never commit secrets. This file exists to document the
# contract (which keys pgcopydb expects); the real Secret should be created
# out-of-band, e.g.:
#
#   kubectl create secret generic pgcyan-db-uris -n pgcyan-migration \
#     --from-literal=PGCOPYDB_SOURCE_PGURI='postgres://...' \
#     --from-literal=PGCOPYDB_TARGET_PGURI='postgres://...'
#
# ...or, PREFERRED, do not use this Secret at all: rely on Azure Workload
# Identity (see 01-rbac.yaml) so the pods obtain a short-lived Entra token and
# the PGURIs carry no password. In that case the source/target URIs can live in
# a plain ConfigMap and this Secret is dropped entirely.
#
# pgcopydb reads connection strings from these env vars natively:
#   PGCOPYDB_SOURCE_PGURI, PGCOPYDB_TARGET_PGURI
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: pgcyan-db-uris
  namespace: pgcyan-migration
type: Opaque
stringData:
  # TODO: replace with real values via `kubectl create secret` / sealed-secrets
  # / CSI Secret Store -- never in git. Placeholders below are intentionally
  # non-functional.
  PGCOPYDB_SOURCE_PGURI: "postgres://REPLACE_ME@REPLACE_SOURCE_HOST:5432/appdb?sslmode=require"
  PGCOPYDB_TARGET_PGURI: "postgres://REPLACE_ME@REPLACE_TARGET_HOST:5432/appdb?sslmode=require"
