# 40-job-schema.yaml
# ---------------------------------------------------------------------------
# SCHEMA STEP: pre-data (schema WITHOUT secondary indexes / constraints).
#
# A single coordinator Job. It creates the target schema -- tables, sequences,
# functions, LOB metadata -- but deliberately NOT secondary indexes, PRIMARY
# KEY / UNIQUE constraints, foreign keys, or triggers. In Postgres' dump model
# all of those live in the POST-DATA section (a primary key is backed by an
# index, built after the data lands), which is dramatically faster than
# maintaining them during COPY. They are built by the post-data step.
#
# This runs BEFORE any data shard so every shard finds its target tables already
# present. It is a hard barrier: no shard may start until this succeeds.
#
# MECHANISM: a thin wrapper (`pg_cyan.cli schema`) over pgcopydb.
# `pgcopydb restore pre-data` restores from a custom-format dump file
# in `--dir`, and this pod's `--dir` starts empty, so the wrapper runs two
# steps: `pgcopydb dump schema --snapshot=<id>` (pinned to the snapshot holder's
# snapshot so the schema matches the instant the shards copy) then
# `pgcopydb restore pre-data --no-owner` (pre-data section only).
#
# ORDERING: this step depends on the consistent snapshot. The CONTROLLER holds
# that snapshot in its own pod and INJECTS `SNAPSHOT_ID` into this Job's env at
# apply time (no `pgcyan-snapshot` ConfigMap). The wrapper pins `dump schema` to
# it, exactly like the data shards.
# See also: pg_cyan/copy/predata.py
apiVersion: batch/v1
kind: Job
metadata:
  name: pgcyan-schema
  namespace: pgcyan-migration
spec:
  backoffLimit: 3           # pre-data is cheap to retry; the wrapper is idempotent
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        pgcyan.dev/step: "schema"
    spec:
      serviceAccountName: pgcyan-worker
      # The image runs as non-root uid 1000 ('migration', Dockerfile: useradd
      # -u 1000). A freshly-provisioned Azure managed disk mounts root:root 0755,
      # which uid 1000 cannot write (pgcopydb: "Failed to create directory
      # /work/schema: Permission denied"). fsGroup group-owns the work disk to
      # gid 1000 so the process can write; OnRootMismatch skips re-chowning the
      # catalog on every resume/restart.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000       # 'migration' from the image
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      restartPolicy: Never
      containers:
        - name: pgcopydb-predata
          image: "${PGCYAN_IMAGE}"
          # Thin wrapper: dump schema (pinned to the snapshot) + restore pre-data.
          # It writes target-pg-schema-log.json to $PG_OUTPUT_DIR on success.
          #
          # --skip-extensions: on Azure Database for PostgreSQL, platform-managed
          # extensions (`azure`, `pgaadauth`) are NOT allow-listed for the
          # azure_pg_admin role, so pg_restore's CREATE/DROP EXTENSION for them
          # fails and aborts the whole pre-data restore. Extensions on Azure must
          # be pre-provisioned via the `azure.extensions` server parameter, not
          # carried in a schema dump -- so pre-data skips them by design.
          command: ["python", "-m", "pg_cyan.cli", "schema", "--skip-extensions"]
          env:
            # SNAPSHOT_ID is injected at apply time by the controller, which holds
            # the consistent snapshot in-pod and knows the id directly
            # -- no `pgcyan-snapshot` ConfigMap. The wrapper pins `dump schema` to
            # it so the schema matches the instant the shards copy. (A standalone
            # `kubectl apply` of this Job must set SNAPSHOT_ID in the env itself.)
            # pgcopydb --dir (dump lands here) AND the log output dir.
            - name: PGCYAN_WORK_DIR
              value: "/work"
            - name: PG_OUTPUT_DIR
              value: "/work"
          envFrom:
            - secretRef:
                name: pgcyan-db-uris   # PGCOPYDB_SOURCE_PGURI / _TARGET_PGURI
          volumeMounts:
            - name: workdir
              mountPath: /work
          resources:
            # Pre-data is schema DDL only -- tiny. Small request so it
            # co-schedules with the controller on a single small node.
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
      volumes:
        # Pre-data's own ReadWriteOnce work disk (SQLite/WAL off Azure Files).
        # Pre-applied from 20-pvc-workdir.yaml.
        - name: workdir
          persistentVolumeClaim:
            claimName: pgcyan-workdir-predata
