# 12-configmap-plan.yaml
# ---------------------------------------------------------------------------
# The planner's OUTPUT: the parallelism plan. This ConfigMap is the seam between
# the (intelligent) planner and the (dumb) executors. Every downstream Job reads
# only its own slice from here; no Job needs to know about any other Job, which
# is what keeps the shards shared-nothing.
#
# TWO kinds of content live here:
#   1. plan.json           -- the machine-readable plan the orchestrator walks
#                             to decide how many shard Jobs to stamp out and with
#                             what resources.
#   2. shard-<n>.filters   -- one pgcopydb filter file per data shard. pgcopydb
#                             consumes these via `--filters <file>`; the
#                             [include-only-table] section is how we guarantee a
#                             shard touches ONLY its assigned tables and nothing
#                             overlaps. THIS is where "the planner makes sure
#                             nothing overlaps" is physically enforced.
#
# TODO: this whole ConfigMap is GENERATED by the planner Job (30-job-planner).
# The content below is an illustrative 2-shard example so the templates in
# 60/70 have something concrete to reference. The planner overwrites it.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgcyan-plan
  namespace: pgcyan-migration
  labels:
    pgcyan.dev/generated-by: planner
data:
  plan.json: |
    {
      "TODO": "generated by the planner; illustrative shape only",
      "run_id": "REPLACE_ME_RUN_ID",
      "snapshot": { "mode": "coordinator-held", "not_consistent": false },
      "data_shards": [
        { "name": "shard-0", "filter_file": "shard-0.filters",
          "table_jobs": 4, "split_tables_larger_than": "50GB",
          "resources": { "cpu": "2", "memory": "4Gi" } },
        { "name": "shard-1", "filter_file": "shard-1.filters",
          "table_jobs": 8, "split_tables_larger_than": "50GB",
          "resources": { "cpu": "4", "memory": "8Gi" } }
      ],
      "index_shards": [
        { "name": "idx-0", "filter_file": "shard-0.filters", "index_jobs": 4 },
        { "name": "idx-1", "filter_file": "shard-1.filters", "index_jobs": 4 }
      ],
      "notes": "index/FK compute runs on the TARGET server; pod sizing for the post-data steps is near-irrelevant, so keep index/fk pods thin and instead raise target index_jobs + maintenance_work_mem for the window."
    }
  # --- Example filter files (pgcopydb --filters format) -------------------
  # ASSUMPTION: LPT bin-packing put the big tables on shard-1, the long tail on
  # shard-0. Real files are emitted by the planner from the metrics.
  shard-0.filters: |
    [include-only-table]
    public.customers
    public.addresses
  shard-1.filters: |
    [include-only-table]
    public.orders
    public.order_lines
