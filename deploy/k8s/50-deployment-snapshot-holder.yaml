# 50-deployment-snapshot-holder.yaml
# ---------------------------------------------------------------------------
# PHASE 1: the SNAPSHOT HOLDER -- the single most safety-critical object here.
#
# THE PROBLEM it solves: a Postgres exported snapshot is only valid while the
# transaction that exported it stays open. The moment that connection closes,
# `SET TRANSACTION SNAPSHOT` in the shards fails and each shard would otherwise
# fall back to its OWN, DIFFERENT point in time -> silent cross-shard
# inconsistency / corruption. Because our shards are shared-nothing separate
# pods, none of them can own the snapshot on behalf of the others.
#
# THE FIX: one long-lived pod runs `pg_cyan.cli snapshot-hold` (issue #23), a
# thin wrapper that establishes the whole consistent replication setup in one
# coordinated step -- it creates the publication FOR ALL TABLES, then drives
# `pgcopydb snapshot --follow` to create the pgoutput slot, export its
# consistent snapshot, write the snapshot id under the shared work dir, and HOLD
# the exporting connection open. Every phase-0/2 pod reads that id and passes
# `--snapshot`, so they all copy the SAME instant. This pod must stay Running
# for the entire duration of the initial COPY (phases 0-2). Hence a Deployment
# (restarts if killed), not a Job. On graceful shutdown the wrapper terminates
# pgcopydb, which closes the replication connection -- no stale source
# connection is left behind.
#
# CAVEAT: if this pod dies, the snapshot is GONE and cannot be recreated at the
# same LSN -- the in-flight initial copy must restart (--restart) from a new
# snapshot. Treat this pod as a singleton pet: PodDisruptionBudget + priority.
#
# ALTERNATIVE (frozen source): if the source is quiesced/read-only for the
# migration window, skip this pod entirely and give the shards
# `--not-consistent` (each takes its own snapshot; safe because nothing writes).
# The planner records which mode applies in plan.json -> snapshot.mode.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgcyan-snapshot-holder
  namespace: pgcyan-migration
spec:
  replicas: 1              # MUST be exactly 1 -- a second holder = a second snapshot
  strategy:
    type: Recreate         # never run two holders at once
  selector:
    matchLabels:
      pgcyan.dev/phase: "snapshot-holder"
  template:
    metadata:
      labels:
        pgcyan.dev/phase: "snapshot-holder"
    spec:
      serviceAccountName: pgcyan-worker
      # Give the wrapper time to SIGTERM pgcopydb and let it close the
      # replication connection before k8s SIGKILLs the pod -- a clean exit is
      # what prevents a stale source connection (issue #23).
      terminationGracePeriodSeconds: 60
      # TODO: add a high PriorityClass so this pod is the LAST to be evicted
      # under node pressure. Its death invalidates the whole initial copy.
      # priorityClassName: pgcyan-critical
      containers:
        - name: snapshot
          image: "pgcyanacr.azurecr.io/pgcyan:0.1.0@sha256:a348ba7ddb6eedf0658f4b9bee9312eee128085f9de7896da8a0b89835b2940a"
          # `pg_cyan.cli snapshot-hold` creates the publication FOR ALL TABLES,
          # drives `pgcopydb snapshot --follow` to create the pgoutput slot +
          # export the consistent snapshot (writing its id to
          # /work/coordinator/snapshot and source-pg-{slot,publication}.json
          # alongside it), then blocks holding the exporting connection until it
          # receives SIGTERM. Shards read the snapshot id file.
          command: ["python", "-m", "pg_cyan.cli", "snapshot-hold"]
          env:
            # pgcopydb keeps a SQLite catalog under --dir and opens it in WAL
            # mode, which needs file locking + shared memory that Azure Files
            # (SMB) does NOT provide -- on the shared RWX PVC pgcopydb aborts with
            # "PRAGMA journal_mode = WAL failed: database is locked". So --dir
            # lives on a node-local emptyDir (scratch below); the holder is
            # non-resumable by design, so it needs no persistence there.
            - name: PGCYAN_WORK_DIR
              value: "/pgcopydb"
            # The HANDOFF artifacts (snapshot id + JSON) still land on the shared
            # /work volume so phases 0/2 -- and the integration test -- see them.
            - name: PG_OUTPUT_DIR
              value: "/work/coordinator"
            # Publication/slot/mode default to the planner's defaults; the
            # orchestrator overrides these (or mounts plan.json at
            # $PGCYAN_PLAN_FILE) so the holder and the plan agree.
            - name: PGCYAN_PUBLICATION
              value: "pgcyan_pub"
            - name: PGCYAN_SLOT
              value: "pgcyan_slot"
            - name: PGCYAN_SNAPSHOT_MODE
              value: "coordinator-held"
          envFrom:
            - secretRef:
                name: pgcyan-db-uris    # PGCOPYDB_SOURCE_PGURI (pgcopydb-native)
          volumeMounts:
            - name: workdir
              mountPath: /work
            # pgcopydb's private --dir (SQLite/WAL catalog) on node-local disk,
            # off Azure Files (SMB cannot satisfy SQLite WAL locking).
            - name: pgcopydb-scratch
              mountPath: /pgcopydb
          resources:
            # Holds one idle transaction. Essentially free.
            requests: { cpu: "50m",  memory: "128Mi" }
            limits:   { cpu: "250m", memory: "256Mi" }
          # Ready only once the whole setup is established: source-pg-slot.json
          # is written last (after the publication, slot, and exported snapshot),
          # so its presence means the holder is fully up. A restart means a NEW
          # snapshot, so the orchestrator must treat a holder restart as "initial
          # copy must --restart". TODO: wire an alert on restartCount > 0.
          readinessProbe:
            exec:
              command: ["test", "-f", "/work/coordinator/source-pg-slot.json"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: workdir
          persistentVolumeClaim:
            claimName: pgcyan-workdir
        # Node-local scratch for pgcopydb's SQLite catalog. Ephemeral is fine:
        # the holder is non-resumable (a restart == a new snapshot), so nothing
        # here needs to survive the pod.
        - name: pgcopydb-scratch
          emptyDir: {}
---
# Guard against voluntary disruption (node drain / autoscaler) evicting the
# singleton holder mid-copy.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pgcyan-snapshot-holder
  namespace: pgcyan-migration
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      pgcyan.dev/phase: "snapshot-holder"
