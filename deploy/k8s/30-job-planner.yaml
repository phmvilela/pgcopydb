# 30-job-planner.yaml
# ---------------------------------------------------------------------------
# PHASE -1 (control plane): the PLANNER.
#
# Reads the inputs ConfigMap (metrics + parameters + constraints), runs the
# deterministic bin-packing / DAG planner, and WRITES the pgcyan-plan ConfigMap
# (plan.json + shard-<n>.filters). It does not touch Postgres data; it only
# reads the already-collected metadata and produces a plan.
#
# The planner is `python -m pg_cyan.cli plan` (pg_cyan/planner.py, issue #38):
#   * loads /inputs/*.json (source-pg-metrics + source-pg-largeobjects, plus the
#     optional parameters/constraints),
#   * runs the LOB abort gate -- if the source has any large objects it exits
#     non-zero and writes NO plan (pgoutput CDC does not replicate LOBs),
#   * LPT bin-packs tables into N disjoint shards by heap bytes (fixed N=4 for
#     now; oversized tables stay whole and split within their job via
#     split_tables_larger_than -- cross-shard range-split is a follow-up),
#   * records snapshot mode / publication / slot; emits a deferred FK graph
#     (real FK collection is a follow-up), and
#   * writes plan.json + shard-<n>.filters to --output-dir.
# This Job writes those files to a scratch emptyDir and then publishes them into
# the pgcyan-plan ConfigMap with kubectl (needs the pgcyan-orchestrator RBAC:
# configmaps create/patch). 12-configmap-plan.yaml is the illustrative stand-in
# it overwrites.
#
# ASSUMPTION: the pg_cyan container image bundles the planner CLI, pgcopydb, and
# kubectl. See Dockerfile / devcontainer toolchain.
# ---------------------------------------------------------------------------
apiVersion: batch/v1
kind: Job
metadata:
  name: pgcyan-planner
  namespace: pgcyan-migration
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400   # keep for a day for post-mortem, then GC
  template:
    metadata:
      labels:
        pgcyan.dev/phase: "planner"
    spec:
      serviceAccountName: pgcyan-orchestrator   # needs configmap write RBAC
      restartPolicy: Never
      containers:
        - name: planner
          # Bundles the planner CLI + pgcopydb + kubectl (built by the repo
          # Dockerfile, pushed to ACR -- see .github/workflows/publish-image.yml).
          # Repoint to your ACR login server if acr_name differs from the default.
          image: "pgcyanacr.azurecr.io/pgcyan:0.1.0@sha256:a348ba7ddb6eedf0658f4b9bee9312eee128085f9de7896da8a0b89835b2940a"
          # Run the planner into a scratch dir, then publish plan.json +
          # shard-<n>.filters into the pgcyan-plan ConfigMap. If the LOB abort
          # gate fires, `plan` exits non-zero here and the Job fails without
          # touching the ConfigMap.
          command: ["sh", "-c"]
          args:
            - >
              python -m pg_cyan.cli plan
              --inputs-dir=/inputs
              --output-dir=/work/plan
              &&
              kubectl create configmap pgcyan-plan
              --from-file=/work/plan
              --dry-run=client -o yaml | kubectl apply -f -
          volumeMounts:
            - name: inputs
              mountPath: /inputs
              readOnly: true
            - name: work
              mountPath: /work
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
      volumes:
        - name: inputs
          configMap:
            name: pgcyan-planner-inputs
        - name: work
          emptyDir: {}
