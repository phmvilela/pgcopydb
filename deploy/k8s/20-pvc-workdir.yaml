# pgcopydb work directories (the `--dir` target) -- one PER WORKLOAD, on
# ReadWriteOnce managed disks.
#
# WHY RWO managed disks, not shared Azure Files: pgcopydb keeps its catalog as a
# SQLite DB under `--dir` opened in WAL mode, which needs file locking + shared
# memory that Azure Files (SMB) does NOT provide -- on a shared azurefile-csi RWX
# volume pgcopydb aborts before doing any work ("PRAGMA journal_mode = WAL
# failed: database is locked"). A per-pod RWO managed disk is a local ext4 block
# device with real POSIX locking, exactly what SQLite WAL expects. Unlike an
# emptyDir it also PERSISTS across pod restarts, so a killed/OOM-drained shard
# re-attaches the same disk and pgcopydb `--resume` picks up at per-table
# granularity instead of re-copying its whole table set from zero.
#
# Azure Files NFS was rejected because SQLite-over-NFS with WAL is discouraged
# upstream. A StatefulSet with volumeClaimTemplates is unnecessary: a plain Job
# pod mounts a pre-created RWO PVC by claimName, and StatefulSet pods restart on
# exit 0 (never "Complete"), which would break the orchestrator's Job-completion
# barrier.
#
# RWO is safe because exactly one pod uses each disk at a time (one pod per shard;
# the index/FK/CDC singletons run in their own steps).
#
# The controller holds the snapshot in-pod and injects the id into the step pods
# directly, so there is no shared RWX PVC and no pgcyan-snapshot ConfigMap.
# See also: deploy/k8s/35-statefulset-controller.yaml
#
# WHICH PVCs live where:
#   * The SINGLETON steps -- schema, foreign-keys, follow -- each get
#     one of the three PVCs below (applied once, up front).
#   * The FANNED-OUT steps -- copy and indexes -- get one
#     PVC per plan entry, stamped by the orchestrator from the PVC document at
#     the top of 60-/70-*.template.yaml (named pgcyan-workdir-<shard>).
#
# RECLAIM / lifecycle: the catalog holds resume state, so if you want resume to
# survive a full namespace teardown the RWO StorageClass should use
# `reclaimPolicy: Retain`. Within a single migration run the PVC persists across
# pod restarts regardless, which is what the resume guarantee needs.
#
# SIZE: the work dir holds catalogs + metadata, NOT table data, so it is small
# (single-digit GiB) unless CTID-split spill lands here. 10Gi is generous;
# Azure bills managed disks per performance tier, so this is cheap.
# ---------------------------------------------------------------------------
#
# ASSUMPTION: a dynamic RWO managed-disk StorageClass exists. On AKS this is
# `managed-csi` (Standard SSD) or `managed-csi-premium` (Premium SSD, higher
# IOPS). Set explicitly rather than relying on the cluster default. If your
# class name differs, update it here AND in the two `.template.yaml` PVC docs.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgcyan-workdir-predata      # the schema step (40-job-phase0-predata.yaml)
  namespace: pgcyan-migration
  labels:
    pgcyan.dev/workdir: "predata"
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
  storageClassName: managed-csi     # TODO: confirm the RWO class name on the target cluster
---
# (No foreign-keys FK disk: the FK pass is pure psycopg2 -- no pgcopydb catalog to
# persist -- so 71-job-phase3-fk.yaml uses an emptyDir, not a PVC.)
# (No follow CDC disk here: the CONTROLLER is the CDC consumer and uses its OWN
# --dir, a volumeClaimTemplate on the StatefulSet in
# 35-statefulset-controller.yaml -- not a standalone PVC.)
