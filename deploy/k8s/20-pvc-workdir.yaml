# 20-pvc-workdir.yaml
# ---------------------------------------------------------------------------
# pgcopydb work directories (the `--dir` target) -- one PER WORKLOAD, on
# ReadWriteOnce managed disks. This is the resolution of issue #58.
#
# THE PROBLEM (issue #58, first hit by the holder in #57): pgcopydb stores its
# catalog as a SQLite DB under `--dir` and opens it in WAL mode, which needs
# file locking + shared memory that Azure Files (SMB) does NOT provide. On a
# shared `azurefile-csi` RWX volume pgcopydb aborts before doing any work:
#     ERROR catalog.c [SQLite]: PRAGMA journal_mode = WAL failed:
#           database is locked  (rc=12)
#
# THE FIX (option 2b): give every pgcopydb pod its OWN ReadWriteOnce managed
# disk (local ext4 block device -- exactly the environment SQLite WAL expects,
# with real POSIX locking). Unlike a node-local `emptyDir`, a managed disk
# PERSISTS across pod restarts: a killed/OOM-drained shard re-attaches the same
# disk and pgcopydb `--resume` picks up at per-table (per-part) granularity
# instead of re-copying its whole table set from zero. This is the resume
# guarantee the shards need and an emptyDir cannot give.
#
# WHY NOT the alternatives:
#   * Azure Files NFS (`azurefile-csi-nfs`): a one-line StorageClass swap, but
#     SQLite-over-NFS with WAL is discouraged upstream -- correctness on the
#     resume path would have to be load-validated. We engineer the risk out
#     instead of betting on it.
#   * A StatefulSet with `volumeClaimTemplates`: unnecessary. A plain Job pod
#     can mount a PRE-CREATED RWO PVC by claimName -- one pod per shard is
#     already RWO-shaped. Only *dynamic per-replica* provisioning needs a
#     StatefulSet, and going there would break the orchestrator's Job-completion
#     barrier (StatefulSet pods restart on exit 0; they never "Complete").
#
# WHY RWO is safe here: exactly one pod uses each disk at a time (one pod per
# shard; the index/FK/CDC singletons run in their own phases). RWO -- attach to
# one node at a time -- is all that is required.
#
# SNAPSHOT HANDOFF no longer rides a shared volume: the holder publishes the
# exported snapshot id to the `pgcyan-snapshot` ConfigMap (see
# 50-deployment-snapshot-holder.yaml), which the data shards read via
# `configMapKeyRef`. So there is NO shared RWX PVC any more.
#
# WHICH PVCs live where:
#   * The SINGLETON phases -- pre-data (0), FK (3b), follow-CDC (4) -- each get
#     one of the three PVCs below (applied once, up front, like the old shared
#     PVC was).
#   * The FANNED-OUT phases -- data shards (2) and index shards (3a) -- get one
#     PVC per plan entry, stamped by the orchestrator from the PVC document at
#     the top of 60-/70-*.template.yaml (named pgcyan-workdir-<shard>).
#
# RECLAIM / lifecycle: the catalog holds resume state, so if you want resume to
# survive a full namespace teardown the RWO StorageClass should use
# `reclaimPolicy: Retain`. Within a single migration run the PVC persists across
# pod restarts regardless, which is what the resume guarantee needs.
#
# SIZE: the work dir holds catalogs + metadata, NOT table data, so it is small
# (single-digit GiB) unless CTID-split spill lands here. 10Gi is generous;
# Azure bills managed disks per performance tier, so this is cheap.
# ---------------------------------------------------------------------------
#
# ASSUMPTION: a dynamic RWO managed-disk StorageClass exists. On AKS this is
# `managed-csi` (Standard SSD) or `managed-csi-premium` (Premium SSD, higher
# IOPS). Set explicitly rather than relying on the cluster default. If your
# class name differs, update it here AND in the two `.template.yaml` PVC docs.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgcyan-workdir-predata      # phase 0 (40-job-phase0-predata.yaml)
  namespace: pgcyan-migration
  labels:
    pgcyan.dev/workdir: "predata"
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
  storageClassName: managed-csi     # TODO: confirm the RWO class name on the target cluster
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgcyan-workdir-fk           # phase 3b (71-job-phase3-fk.yaml)
  namespace: pgcyan-migration
  labels:
    pgcyan.dev/workdir: "fk"
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
  storageClassName: managed-csi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgcyan-workdir-cdc          # phase 4 (80-deployment-follow-cdc.yaml)
  namespace: pgcyan-migration
  labels:
    pgcyan.dev/workdir: "cdc"
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      # CDC may spill wal2json transform files here -- give it more headroom.
      storage: 20Gi
  storageClassName: managed-csi
