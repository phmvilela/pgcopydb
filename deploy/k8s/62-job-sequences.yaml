# 62-job-sequences.yaml
# ---------------------------------------------------------------------------
# SEQUENCES STEP: SEQUENCE SYNC -- a single coordinated pass, run after the data copy
# (the copy step) and before CDC.
#
# WHY IT EXISTS: the sharded copy loads rows with their EXPLICIT id values
# (`pgcopydb copy table-data` -> COPY), which never advances the owning
# identity/serial SEQUENCE. So every target sequence is left at its start; the
# next `nextval` returns 1. That silently breaks CDC (apply sets identity columns
# to DEFAULT -> nextval -> 1 -> collides with the copied row id=1, conflict
# swallowed on commit) and any post-cutover INSERT. `pgcopydb clone` does this as
# its "STEP 9: reset sequences"; our custom copy skips it, so this step does it.
#
# WHY CUSTOM SQL (not `pgcopydb copy sequences`): pgcopydb's per-object `copy`
# sub-commands no-op in our standalone per-pod --dir. This is pure psycopg2 (read
# source pg_sequences, setval on the target) -- no pgcopydb catalog, so an
# emptyDir for the one small output JSON suffices.
# See also: pg_cyan/sequences.py
apiVersion: batch/v1
kind: Job
metadata:
  name: pgcyan-sequences
  namespace: pgcyan-migration
  labels:
    pgcyan.dev/step: "sequences"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        pgcyan.dev/step: "sequences"
    spec:
      serviceAccountName: pgcyan-worker
      # Non-root uid 1000 ('migration'). No managed-disk PVC -- pure psycopg2, so
      # an emptyDir for the output JSON suffices (no fsGroup needed).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      restartPolicy: Never
      containers:
        - name: pgcyan-sequences
          image: "${PGCYAN_IMAGE}"
          # The pg_cyan `sequences` wrapper (PgCyanSequences): read each
          # source sequence's value and setval it on the target, so target ids
          # continue past the copied rows (else CDC/post-cutover inserts collide).
          command: ["python", "-m", "pg_cyan.cli", "sequences"]
          envFrom:
            - secretRef:
                name: pgcyan-db-uris     # PGCOPYDB_SOURCE_PGURI / _TARGET_PGURI
          env:
            - name: PG_OUTPUT_DIR
              value: "/work"
          volumeMounts:
            - name: workdir
              mountPath: /work
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: workdir
          emptyDir: {}                   # scratch for the output JSON only
