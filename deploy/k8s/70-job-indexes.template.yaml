# 70-job-indexes.template.yaml
# ---------------------------------------------------------------------------
# INDEXES STEP: SECONDARY INDEX + PK/UNIQUE builds. TEMPLATE -- one Job per plan.json >
# index_shards entry. Runs only AFTER the copy barrier (every data shard
# succeeded), because an index over half-loaded data is worthless.
#
# CRITICAL RESOURCE INSIGHT (this drove the whole post-data design):
#   The heavy compute of CREATE INDEX runs ON THE TARGET POSTGRES SERVER, not in
#   this pod. This pod issues `CREATE INDEX` / `ADD CONSTRAINT` and then just holds
#   a connection open and WAITS. Giving this pod more CPU/RAM does almost nothing.
#   Therefore:
#     * pods here are deliberately THIN (see resources below);
#     * the real throughput levers are TARGET-SIDE: the number of index shards
#       (this template, one Job each), the target's maintenance_work_mem,
#       max_parallel_maintenance_workers, CPU cores and IOPS. The planner should
#       raise those for the index window (and consider temporarily scaling the
#       target SKU UP, then back down).
#   Sharding index builds across several Jobs helps ONLY up to the target's core
#   count -- each CREATE INDEX pins ~1 target core; beyond ~target_vCPU total
#   concurrent builds, extra jobs just queue on the server.
#
# STORAGE: none. the indexes step is pure psycopg2 (custom SQL -- introspect the source's
# index/constraint defs, apply to the target); it holds no pgcopydb catalog, so it
# only needs a scratch dir for the one small output JSON. An emptyDir suffices --
# no managed-disk PVC, no fsGroup (only the pgcopydb steps need those).
# See also: pg_cyan/copy/postindex.py
apiVersion: batch/v1
kind: Job
metadata:
  # ${INDEX_SHARD_NAME} is substituted per plan.json > index_shards entry, e.g. idx-0
  name: pgcyan-index-${INDEX_SHARD_NAME}
  namespace: pgcyan-migration
  labels:
    pgcyan.dev/step: "indexes"
    pgcyan.dev/shard: "${INDEX_SHARD_NAME}"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        pgcyan.dev/step: "indexes"
    spec:
      serviceAccountName: pgcyan-worker
      # Non-root uid 1000 ('migration'). No managed-disk PVC here (pure psycopg2),
      # so no fsGroup is needed -- the emptyDir scratch is writable by the process.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      restartPolicy: Never
      containers:
        - name: pgcyan-index
          image: "${PGCYAN_IMAGE}"
          # The pg_cyan `indexes` wrapper (PgCyanPostIndex) builds this
          # shard's secondary indexes AND its PK/unique constraints via custom SQL:
          # introspect the source's pg_get_indexdef / pg_get_constraintdef for this
          # shard's --filters tables and apply CREATE INDEX + ADD CONSTRAINT on the
          # target. Idempotent.
          # FKs cross shard boundaries and are the separate single pass in 71.
          command: ["python", "-m", "pg_cyan.cli", "indexes"]
          envFrom:
            - secretRef:
                name: pgcyan-db-uris     # PGCOPYDB_SOURCE_PGURI / _TARGET_PGURI
          env:
            - name: SHARD_NAME
              value: "${INDEX_SHARD_NAME}"       # e.g. idx-0 (recorded in the log)
            - name: FILTER_FILE
              value: "${FILTER_FILE}"            # e.g. shard-0.filters (reused from the copy)
            - name: PGCYAN_PLAN_DIR
              value: "/plan"
            - name: PG_OUTPUT_DIR
              value: "/work"
          volumeMounts:
            - name: workdir
              mountPath: /work
            - name: plan
              mountPath: /plan
              readOnly: true
          resources:
            # THIN ON PURPOSE. The pod waits on the server; it does not compute.
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: workdir
          emptyDir: {}                   # scratch for the output JSON only
        - name: plan
          configMap:
            name: pgcyan-plan
