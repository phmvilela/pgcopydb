# The control-plane identity. One ServiceAccount in pgcyan-system, bound to a
# CLUSTER-scoped role because it must create/delete WHOLE namespaces and the
# resources inside each per-migration namespace it provisions.
#
# Broad by design (no per-user auth on the control plane yet). It is NOT
# cluster-admin: it can manage only the specific resource kinds a migration
# namespace needs -- no nodes, no cluster-scoped RBAC beyond what it needs to
# bind namespaced Roles, no arbitrary CRDs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pgcyan-control-plane
  namespace: pgcyan-system
  labels:
    app.kubernetes.io/part-of: pgcyan
    app.kubernetes.io/component: control-plane
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pgcyan-control-plane
  labels:
    app.kubernetes.io/part-of: pgcyan
    app.kubernetes.io/component: control-plane
rules:
  # Create/tear down the per-migration namespaces themselves.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # Manage the workload identities + scaffolding inside those namespaces. This
  # mirrors what deploy/k8s/ contains for a migration: a ServiceAccount, the
  # DB Secret, the plan/inputs ConfigMaps, the work-dir PVCs, the controller
  # StatefulSet, the phase Jobs, and the headless Service.
  - apiGroups: [""]
    resources: ["serviceaccounts", "secrets", "configmaps", "persistentvolumeclaims", "services"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  # The controller manifest carries a PodDisruptionBudget (and the orchestrator
  # may apply more), so the control plane must be able to create them.
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  # Create the per-migration Role + RoleBinding (the orchestrator/worker RBAC
  # that deploy/k8s/01-rbac.yaml defines today). `bind`/`escalate` are required
  # so this SA may CREATE a Role/RoleBinding granting permissions without being
  # blocked by the privilege-escalation check -- without them create succeeds
  # for plain rules but is Forbidden for anything it does not itself already
  # hold. Scoped to the rbac group only.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete", "bind", "escalate"]
  # Observe the migrations it provisions (pod status/logs, events, run-state).
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pgcyan-control-plane
  labels:
    app.kubernetes.io/part-of: pgcyan
    app.kubernetes.io/component: control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pgcyan-control-plane
subjects:
  - kind: ServiceAccount
    name: pgcyan-control-plane
    namespace: pgcyan-system
