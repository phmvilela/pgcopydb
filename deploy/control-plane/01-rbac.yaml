# The control-plane identity. One ServiceAccount in pgcyan-system, bound to a
# CLUSTER-scoped role because it must create/delete WHOLE namespaces and the
# resources inside each per-migration namespace it provisions.
#
# Broad by design (no per-user auth on the control plane yet). It is NOT
# cluster-admin: it can manage only the specific resource kinds a migration
# namespace needs, no arbitrary CRDs. It can create ClusterRoleBindings (#158,
# for cluster-capacity's per-namespace node-reader grant) but can only ever
# `bind` the single pre-existing pgcyan-node-reader ClusterRole below -- it
# cannot fabricate or bind any other cluster-scoped privilege.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pgcyan-control-plane
  namespace: pgcyan-system
  labels:
    app.kubernetes.io/part-of: pgcyan
    app.kubernetes.io/component: control-plane
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pgcyan-control-plane
  labels:
    app.kubernetes.io/part-of: pgcyan
    app.kubernetes.io/component: control-plane
rules:
  # Create/tear down the per-migration namespaces themselves.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # Manage the workload identities + scaffolding inside those namespaces. This
  # mirrors what deploy/k8s/ contains for a migration: a ServiceAccount, the
  # DB Secret, the plan/inputs ConfigMaps, the work-dir PVCs, the controller
  # StatefulSet, the step Jobs, and the headless Service.
  - apiGroups: [""]
    resources: ["serviceaccounts", "secrets", "configmaps", "persistentvolumeclaims", "services"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  # The controller manifest carries a PodDisruptionBudget (and the orchestrator
  # may apply more), so the control plane must be able to create them.
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  # Create the per-migration Role + RoleBinding (the orchestrator/worker RBAC
  # that deploy/k8s/01-rbac.yaml defines today). `bind`/`escalate` are required
  # so this SA may CREATE a Role/RoleBinding granting permissions without being
  # blocked by the privilege-escalation check -- without them create succeeds
  # for plain rules but is Forbidden for anything it does not itself already
  # hold. Scoped to the rbac group only.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete", "bind", "escalate"]
  # Create/delete the per-migration node-reader ClusterRoleBinding (#158) so
  # cluster-capacity's node listing works for control-plane-provisioned
  # migrations, mirroring deploy/k8s/01-rbac.yaml's pgcyan-node-reader binding
  # for the fixed integration-test namespace. `bind` on the ClusterRole below
  # is required by Kubernetes' privilege-escalation check for creating a
  # ClusterRoleBinding that references it -- scoped by resourceNames to that
  # ONE role, so this SA still cannot bind (or fabricate) arbitrary cluster
  # privileges; it stays "not cluster-admin" as stated above.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["bind"]
    resourceNames: ["pgcyan-node-reader"]
  # Observe the migrations it provisions (pod status/logs, events, run-state).
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pgcyan-control-plane
  labels:
    app.kubernetes.io/part-of: pgcyan
    app.kubernetes.io/component: control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pgcyan-control-plane
subjects:
  - kind: ServiceAccount
    name: pgcyan-control-plane
    namespace: pgcyan-system
---
# --- pgcyan-node-reader: read-only, cluster-scoped node listing (#158) --------
# Bootstrapped ONCE here, cluster-wide, rather than re-derived per migration
# from deploy/k8s/01-rbac.yaml (which defines the SAME role for the fixed
# integration-test namespace's own direct apply -- identical rules, applied
# via two independent paths, same as pgcyan-control-plane's own identity being
# fixed infra rather than provisioned per migration). The provisioner
# (control-plane/api/app/provisioner.py) stamps one ClusterRoleBinding per
# dynamic namespace against this role; teardown removes it (cluster-scoped
# objects aren't caught by the namespace-delete cascade).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pgcyan-node-reader
  labels:
    app.kubernetes.io/part-of: pgcyan
    app.kubernetes.io/component: control-plane
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
