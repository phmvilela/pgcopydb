# Node-local ReadWriteOnce disk for the SQLite registry (mounted at /data), same
# pattern as the copy-shard work dirs: SQLite needs real POSIX locking, which a
# managed disk gives and Azure Files does not.
# See also: deploy/k8s/20-pvc-workdir.yaml
#
# RWO means a single writer -- fine for the single-replica API. The Deployment
# uses the `Recreate` strategy so a rollout never briefly runs two pods that
# would both try to mount this volume.
#
# ASSUMPTION: a dynamic RWO managed-disk StorageClass exists (AKS: `managed-csi`).
# 1Gi is ample for a SQLite registry of migration rows.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgcyan-control-plane-registry
  namespace: pgcyan-system
  labels:
    app.kubernetes.io/part-of: pgcyan
    app.kubernetes.io/component: control-plane
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
  storageClassName: managed-csi   # TODO: confirm the RWO class name on the target cluster
